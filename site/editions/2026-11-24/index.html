<title>Jungle Newsroom Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 1080x1350 slides in Jungle's Instagram carousel style (dark concrete texture, hairline top bar,
   Poppins, Jungle green for the key words, the jungle wordmark bottom right). Story slides lead with a picture.
   Viewer mode (default) shows one slide at a time; print mode (set by render.js) stacks them for PNG/PDF export. */
:root{
  --bg:#3b3936; --white:#ffffff; --soft:#dedad3; --dim:#aaa59d; --green:#7ef25c; --amber:#ffc94a; --grey:#8d8880;
  --sans:'Poppins','Helvetica Neue',Arial,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#161514;color:var(--white);font-family:var(--sans)}
a{color:inherit}

.slide{position:relative;width:1080px;height:1350px;box-sizing:border-box;padding:136px 76px 150px;overflow:hidden;background:var(--bg);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(0,0,0,.35),transparent 60%)}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.slide > *{position:relative;z-index:1}
em{font-style:normal;color:var(--green)}

.bar{position:absolute;top:52px;left:76px;right:76px;display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.55);
  font-size:21px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.bar span:last-child{text-transform:none;font-weight:500}
.mark{position:absolute;right:70px;bottom:56px;height:52px}
.mark img{height:100%;display:block}
.foot{position:absolute;left:76px;bottom:58px;max-width:700px;font-size:19px;line-height:1.45;color:var(--dim)}
.foot a{color:var(--green);text-decoration:none;font-weight:600;word-break:break-all}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center}
.cover .kick{font-size:28px;font-weight:600;color:var(--soft);margin:0 0 4px}
.cover h1{font-size:132px;font-weight:800;line-height:.95;letter-spacing:-.04em;margin:0;color:var(--green)}
.cover .sub{font-size:62px;font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:8px 0 44px}
.cover h3{font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:22px 0 10px}
.cover ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cover li{font-size:27px;font-weight:500;line-height:1.25;color:var(--soft);padding-left:26px;position:relative}
.cover li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--green)}

/* story */
.pic{height:500px;border-radius:30px;overflow:hidden;background:#222;margin:0 0 30px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.chip{font-size:19px;font-weight:600;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 16px;color:var(--soft)}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.peak{border-color:var(--amber);color:var(--amber)}
.chip.spoil{border-color:#ff7a66;color:#ff7a66}
.chip.down{border-color:var(--grey);color:var(--grey)}
.story h2{font-size:56px;font-weight:700;line-height:1.08;letter-spacing:-.03em;margin:0 0 18px;text-wrap:balance}
.story .what{font-size:25px;font-weight:400;line-height:1.5;margin:0 0 20px;color:var(--soft)}
.why{border-left:5px solid var(--green);padding:2px 0 2px 22px}
.why p{margin:0;font-size:24px;font-weight:500;line-height:1.45}
.why b{color:var(--green);font-weight:700}

/* watch list */
.watch h2{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:30px 0 44px}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.wl li{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(0,0,0,.25);border-radius:26px;padding:24px 28px}
.wl .when{font-size:20px;font-weight:700;color:#1d1c1a;background:var(--green);border-radius:999px;text-align:center;padding:6px 10px;align-self:start}
.wl .t{font-size:29px;font-weight:700;line-height:1.2;margin:0}
.wl .n{font-size:22px;font-weight:400;line-height:1.45;margin:6px 0 0;color:var(--soft)}

/* desk */
.desk .head{display:flex;align-items:center;gap:28px;margin:12px 0 34px}
.desk .tile{width:150px;height:150px;border-radius:28px;background:var(--white);display:grid;place-items:center;flex:none;box-shadow:inset 0 -10px 0 var(--c)}
.desk .tile img{max-width:112px;max-height:74px;margin-bottom:8px}
.desk h2{font-size:58px;font-weight:700;line-height:1.02;letter-spacing:-.03em;margin:0}
.desk .who{font-size:21px;font-weight:500;color:var(--dim);margin:8px 0 0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.ideas li{background:rgba(0,0,0,.28);border-radius:26px;padding:24px 28px;border-top:6px solid var(--c)}
.lbl{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.ideas .idea{font-size:30px;font-weight:700;line-height:1.25;margin:0}
.ideas .note{font-size:22px;font-weight:400;line-height:1.45;margin:8px 0 0;color:var(--soft)}
.wo{margin-top:24px;border:2px solid var(--amber);border-radius:26px;padding:22px 28px}
.wo .lbl{color:var(--amber)}
.wo p.t{font-size:25px;font-weight:600;line-height:1.4;margin:0}

/* end */
.end{display:flex;flex-direction:column;justify-content:center}
.end h2{font-size:112px;font-weight:800;line-height:.98;letter-spacing:-.04em;margin:0 0 30px}
.end p{font-size:32px;font-weight:500;line-height:1.45;margin:0 0 40px;color:var(--soft);max-width:30ch}
.end .go{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:700;color:#1d1c1a;background:var(--green);border-radius:999px;padding:18px 36px;text-decoration:none}
.end .url{font-size:19px;color:var(--dim);margin-top:18px;word-break:break-all}

/* viewer (artifact) */
body:not([data-mode="print"]){min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
body:not([data-mode="print"]) #deck{position:relative;width:min(540px,100%);aspect-ratio:1080/1350}
body:not([data-mode="print"]) .slide{position:absolute;top:0;left:0;transform-origin:top left;display:none}
body:not([data-mode="print"]) .slide.on{display:block}
body:not([data-mode="print"]) .slide.on.cover,body:not([data-mode="print"]) .slide.on.end{display:flex}
.nav{display:flex;align-items:center;gap:14px;font-weight:600;color:var(--soft)}
.nav button{font:inherit;font-weight:700;color:#1d1c1a;background:var(--green);border:none;border-radius:999px;padding:10px 22px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
body[data-mode="print"] .nav{display:none}
body[data-mode="print"] .slide{page-break-after:always;break-after:page}
@page{size:1080px 1350px;margin:0}
</style>

<div id="deck"></div>
<div class="nav"><button id="prev" type="button">Back</button><span id="pos"></span><button id="next" type="button">Next</button></div>

<script id="edition" type="application/json">{"edition":"The daily","coverTitle":"The daily","coverSub":"what’s *moving* on social","dateLabel":"Tuesday 24 November","floorUrl":"../../","sections":{"saw":[{"short":"An I'm A Celebrity camp row sparks a big conversation","headline":"An *I’m A Celebrity camp row* sparks a big conversation","what":"On Sunday’s episode Mariella Frostrup, 64, called AJ Odudu “aggressive” and “dramatic” during a camp cooking row, and AJ replied “Please don’t use that word”. Mariella later apologised, per LADbible and Metro. ITV said duty of care is “of the utmost importance” and that production monitors camp 24/7, per Deadline. Metro reports bosses spoke to Mariella, but ITV’s statement doesn’t confirm it.","why":"The biggest TV talking point of the week. Tone matters, so we keep to the facts.","momentum":"Peaking","region":"UK","platform":"ITV & X","source":"Metro, 23 Nov; LADbible, 23 Nov; Deadline, 23 Nov","credit":"ITV via Metro","url":"https://deadline.com/2026/11/itv-statement-aj-odudu-mariella-frostrup-im-a-celeb-1237231538/","image":"images/imaceleb.jpg"},{"short":"The UK is confirmed as 2035 Women's World Cup host","headline":"The *UK is confirmed as 2035 Women’s World Cup host*","what":"Fifa confirmed England, Northern Ireland, Scotland and Wales as joint hosts of the 2035 Women’s World Cup on Monday, per BBC Sport and Sky Sports. It is the first football World Cup in the UK since the men’s tournament in 1966. The bid proposes 19 venues, with 104 matches, 48 teams and 39 days.","why":"A big, positive sport story for the whole UK. Long runway for brand moments.","momentum":"Peaking","region":"UK","platform":"X & Instagram","source":"BBC Sport, 23 Nov; Sky Sports, 23 Nov","credit":"Fifa via Sky Sports","url":"https://www.bbc.co.uk/sport/football/articles/cx30g83716lzo","image":"images/wwc.jpg"},{"short":"Avengers: Doomsday final trailer drops","headline":"*Avengers: Doomsday* final trailer drops ahead of 18 December","what":"The final Avengers: Doomsday trailer arrived on Monday, ahead of the 18 Dec release, per Variety. In it Robert Downey Jr.’s Doctor Doom says “All of you have lived stolen lives”, per Deadline. Variety’s date is for the release generally. We haven’t checked UK-specific dates.","why":"A Disney and Marvel moment. Trailer day is a social peak for film brands.","momentum":"Peaking","region":"Global","platform":"YouTube & X","source":"Variety, 23 Nov; Deadline, 23 Nov","credit":"Marvel via Variety","url":"https://variety.com/2026/film/news/avengers-doomsday-trailer-captain-america-son-cyclops-x-men-1236893948/","image":"images/avengers.jpg"},{"short":"Strictly confirms Instant Dance returns for week 10","headline":"Strictly confirms *Instant Dance* returns for week 10","what":"Johannes Radebe confirmed on Sunday’s results show that the Instant Dance challenge returns on Saturday 28 Nov, per Radio Times. Each couple picks a dance style at random, makes a quick costume change, and has 10 seconds to decide how to dance it. Radio Times says it caused “chaos and costume changes” last year.","why":"A format everyone remembers. Fans will make predictions all week.","momentum":"Rising","region":"UK","platform":"BBC One & X","source":"Radio Times, 23 Nov","credit":"BBC via Radio Times","url":"https://www.radiotimes.com/tv/entertainment/strictly-come-dancing-instant-dance-challenge-return-newsupdate/","image":"images/instant.jpg"},{"short":"Which? says one in five Black Friday deals was a genuine bargain","headline":"*Which?* says just one in five Black Friday deals was a genuine bargain","what":"Which? tracked 756 home, tech and health appliances at eight retailers and found only 22% of Black Friday 2025 discounts were the lowest price of the year. Retail Gazette reports Vouchernaut data that found 2,300 products had been cheaper in the 24 days before the sales. This is last year’s data. Black Friday is on Fri 27 Nov.","why":"Shoppers are sceptical before the sale. It shapes how deals land on social.","momentum":"Rising","region":"UK","platform":"Cross-platform","source":"Which?, 24 Nov; Retail Gazette, 23 Nov","credit":"Which?","url":"https://www.which.co.uk/news/article/just-one-in-five-black-friday-deals-genuine-bargains-a3llP9R5oq9Q","image":"images/blackfriday.jpg"},{"short":"A Cornwall Christmas market looks nothing like its apparent AI posters","headline":"A Cornwall *Christmas market* looks nothing like its apparent AI posters","what":"The Kernow Christmas Market in Redruth opened in a sparsely decorated warehouse, and visitors compared it to the Willy Wonka Experience, per Metro and LADbible. Its promo images appeared to be AI-generated, though we haven’t seen a statement from the organisers. The funfair was shut on Sunday for high winds. Traders paid from £30 a day, per Metro.","why":"A lesson in expectation versus reality. Fake-looking posters now spread fast.","momentum":"Rising","region":"UK","platform":"Facebook & TikTok","source":"Metro, 23 Nov; LADbible, 23 Nov","credit":"LADbible","url":"https://metro.co.uk/2026/11/23/christmas-market-branded-ai-slop-new-willy-wonka-experience-29811808/","image":"images/market.jpg"}],"platform":[{"short":"Pinterest opens its ad inventory to Microsoft Advertising campaigns","headline":"*Pinterest* opens its ad inventory to Microsoft Advertising campaigns","what":"Pinterest’s open-auction inventory across home feed, search and related Pins can now be reached from Microsoft Advertising campaigns, per Pinterest’s newsroom and Social Media Today. Pinterest quotes 661 million monthly active users and 80 billion monthly searches, with more than half showing commercial intent. These are Pinterest’s own figures.","why":"More ways for advertisers to buy Pinterest. Useful for retail and home clients.","momentum":"Rising","region":"Global","platform":"Pinterest","source":"Pinterest Newsroom, 23 Nov; Social Media Today, 23 Nov","credit":"Pinterest","url":"https://newsroom.pinterest.com/en-au/news/pinterest-microsoft-advertising-integration-2026/","image":"images/pinms.jpg"},{"short":"Pinterest puts teen parental controls on one page","headline":"*Pinterest* puts teen parental controls on one page","what":"Pinterest has put parental controls in one place and added settings for the amount of AI-generated content, notification volume and video autoplay, per its UK newsroom and Social Media Today. Every setting is locked by a parental passcode. It links to device-level screen time and location settings on iOS and Android.","why":"A teen-safety update with a UK page. Good to know for family-facing brands.","momentum":"Rising","region":"UK","platform":"Pinterest","source":"Pinterest Newsroom UK, 23 Nov; Social Media Today, 23 Nov","credit":"Pinterest","url":"https://newsroom.pinterest.com/en-gb/news/helping-families-navigate-controls-for-teens-on-pinterest/","image":"images/pinparents.jpg"},{"short":"Threads previews an iPad app","headline":"*Threads* previews an iPad app","what":"Threads head of design Christopher Clare posted screenshots of the feed on an iPad, with no release date, per Social Media Today. iPad users currently use a browser or the iPhone app. We haven’t seen Clare’s original post.","why":"A sign Threads is building for bigger screens. Nothing live yet.","momentum":"Rising","region":"Global","platform":"Threads","source":"Social Media Today, 23 Nov","credit":"Threads via Social Media Today","url":"https://www.socialmediatoday.com/news/threads-teases-coming-ipad-app/875561/","image":"images/threadsipad.jpg"}]},"watch":[{"when":"Thu 26 Nov","title":"Billie Eilish BST Hyde Park tickets","note":"On sale 10am, per NME. She headlines on Sat 3 Jul 2027."},{"when":"Fri 27 Nov","title":"Hexed in UK cinemas","note":"Disney UK’s cinema date. Black Friday and BBC iPlayer Christmas specials are the same day."},{"when":"Sat 28 Nov","title":"Strictly Instant Dance","note":"A live Saturday show. Man Utd v Brentford is at 3pm, per Sky."},{"when":"Tue 2 Dec","title":"The Man with the Bag","note":"Prime Video’s Christmas film, per Amazon."},{"when":"Fri 18 Dec","title":"Avengers: Doomsday","note":"Release date per Variety. Check the UK date with Disney."}],"desks":[{"id":"disney","name":"Disney UK","short":"Disney UK","byline":"Pip · Disney UK desk","color":"#4a74c9","logo":"logos/disney.png","ideas":[{"from":"Avengers: Doomsday trailer","idea":"A Hexed “trailer day” format: one bold line and a date.","note":"Approved assets only. Cinema date Fri 27 Nov."},{"from":"Hexed week","idea":"A “three days to go” countdown post.","note":"Approved assets only. No box-office claims."}],"watch":"Hexed’s UK rating and assets need sign-off first. No Marvel release claims from this channel."},{"id":"family","name":"Disney Family UK","short":"Disney Family","byline":"Bo · Disney Family UK desk","color":"#a983cf","logo":"logos/disney.png","ideas":[{"from":"Strictly Instant Dance","idea":"A “which dance would your family get?” prompt for Saturday.","note":"No spoilers about results."},{"from":"Black Friday build-up","idea":"A “family gift list” save-the-date post, if any offers are confirmed.","note":"Only confirmed offers. No price claims without approval."}],"watch":"No third-party show imagery without sign-off."},{"id":"store","name":"Disney Store UK","short":"Disney Store","byline":"Lulu · Disney Store UK desk","color":"#d4567f","logo":"logos/disney-store.png","ideas":[{"from":"Black Friday build-up","idea":"A “save the date” tease for any confirmed Disney Store offers.","note":"Only offers Disney Store confirms. No price claims without approval."},{"from":"Avengers: Doomsday trailer","idea":"A Marvel gift tease, only if licensed products are approved.","note":"Marvel licensing sign-off first."}],"watch":"No Marvel or Hexed content without licensing sign-off."},{"id":"muti","name":"Mutti UK","short":"Mutti","byline":"Kiki · Mutti UK desk","color":"#d8302b","logo":"logos/mutti.png","ideas":[{"from":"Black Friday scepticism","idea":"A “price you can trust” pantry staple post, no price claims.","note":"No price or deal claims. Recipe must be approved by Mutti."},{"from":"Cold-weather cooking","idea":"A “tomato soup weather” recipe post for midweek.","note":"Recipe must be tested and approved by Mutti."}],"watch":"Don’t reference other brands, shows or retailers by name."},{"id":"on","name":"Optimum Nutrition UK","short":"Optimum Nutrition","byline":"Rex · Optimum Nutrition UK desk","color":"#c9962c","logo":"logos/on.png","ideas":[{"from":"Women’s World Cup 2035","idea":"A “long-term goals” training tip, no tournament or Fifa marks.","note":"Keep health claims within approved wording."},{"from":"Black Friday build-up","idea":"A “what to look for in a deal” explainer, no price claims.","note":"Keep claims within approved wording."}],"watch":"No health or performance claims beyond the approved list."},{"id":"dfs","name":"DFS","short":"DFS","byline":"Dot · DFS desk","color":"#2f9c8f","logo":"logos/dfs.png","ideas":[{"from":"Which? Black Friday data","idea":"A “how we price our sale” transparency post, if DFS approves.","note":"Any sale or price wording needs approval first."},{"from":"Strictly Instant Dance","idea":"A “best seat in the house” sofa shot for Saturday.","note":"No tagging the show or BBC."}],"watch":"Any sale or price wording needs approval first. No references to Which?."}]}</script>
<script>
(function(){
const E = JSON.parse(document.getElementById('edition').textContent || '{}');
const deck = document.getElementById('deck');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *words* in headlines are set in Jungle green
const hi = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = s => String(s == null ? '' : s).replace(/\*/g, '');
const short = u => String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/$/, '');
const link = u => '<a href="' + esc(u) + '">' + esc(short(u).length > 60 ? short(u).slice(0, 58) + '…' : short(u)) + '</a>';
const MOM = {Rising:'up', Peaking:'peak', Fading:'down'};
const edition = E.edition || 'The daily';
const bar = (l, r) => '<div class="bar"><span>' + esc(l) + '</span><span>' + esc(r) + '</span></div>';
const mark = '<div class="mark"><img src="logos/jungle-wordmark-white.png" alt="jungle"></div>';
const SECTIONS = [['saw', 'Things we saw'], ['platform', 'Platform highlights']];
const S = E.sections || {};
const slides = [];

slides.push('<section class="slide cover">' + bar(edition, 'The Jungle Newsroom · ' + (E.dateLabel || '')) +
  '<p class="kick">The Jungle Newsroom</p><h1>' + hi(E.coverTitle || edition) + '</h1>' +
  '<p class="sub">' + hi(E.coverSub || 'what’s moving on social') + '</p>' +
  SECTIONS.filter(([k]) => (S[k] || []).length).map(([k, name]) => '<h3>' + name + '</h3><ol>' + S[k].map(s => '<li>' + esc(plain(s.short || s.headline)) + '</li>').join('') + '</ol>').join('') +
  mark + '</section>');

SECTIONS.forEach(([k, name]) => {
  const list = S[k] || [];
  list.forEach((s, i) => {
    slides.push('<section class="slide story">' + bar(name, String(i + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0') + ' · ' + (E.dateLabel || '')) +
      (s.image ? '<div class="pic"><img src="' + esc(s.image) + '" alt=""></div>' : '') +
      '<div class="chips">' + (s.spoiler ? '<span class="chip spoil">Spoilers</span>' : '') + '<span class="chip ' + (MOM[s.momentum] || '') + '">' + esc(s.momentum) + '</span><span class="chip">' + esc(s.region) + '</span><span class="chip">' + esc(s.platform) + '</span></div>' +
      '<h2>' + hi(s.headline) + '</h2><p class="what">' + esc(s.what) + '</p>' +
      '<div class="why"><p><b>Why it matters: </b>' + esc(s.why) + '</p></div>' +
      '<div class="foot">' + esc(s.source) + (s.credit ? ' · Image: ' + esc(s.credit) : '') + (s.url ? '<br>' + link(s.url) : '') + '</div>' + mark + '</section>');
  });
});

if ((E.watch || []).length) {
  slides.push('<section class="slide watch">' + bar('This week', E.dateLabel || '') +
    '<h2>Things to watch <em>this week</em></h2><ul class="wl">' +
    E.watch.map(w => '<li><span class="when">' + esc(w.when) + '</span><div><p class="t">' + esc(w.title) + '</p>' + (w.note ? '<p class="n">' + esc(w.note) + '</p>' : '') + '</div></li>').join('') +
    '</ul>' + mark + '</section>');
}

(E.desks || []).forEach(d => {
  if (!(d.ideas || []).length && !d.watch) return;
  slides.push('<section class="slide desk" style="--c:' + d.color + '">' + bar('For our clients', d.short) +
    '<div class="head"><div class="tile">' + (d.logo ? '<img src="' + esc(d.logo) + '" alt="' + esc(d.name) + '">' : '') + '</div>' +
    '<div><h2>' + hi(d.title || ('For *' + d.name + '*')) + '</h2><p class="who">' + esc(d.byline) + '</p></div></div>' +
    '<ul class="ideas">' + (d.ideas || []).map(it => '<li><p class="lbl">Idea · ' + esc(it.from) + '</p><p class="idea">' + esc(it.idea) + '</p>' + (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') + '</li>').join('') + '</ul>' +
    (d.watch ? '<div class="wo"><p class="lbl">Watch out</p><p class="t">' + esc(d.watch) + '</p></div>' : '') +
    mark + '</section>');
});

slides.push('<section class="slide end">' + bar('The Jungle Newsroom', E.dateLabel || '') +
  '<h2>Did we <em>miss</em> something?</h2>' +
  '<p>Spotted something we missed? Or want more of something tomorrow? Reply under this post in #agency-hq.</p>' +
  (E.floorUrl ? '<a class="go" href="' + esc(E.floorUrl) + '">See the newsroom island →</a><p class="url">' + esc(short(E.floorUrl)) + '</p>' : '') +
  mark + '</section>');

deck.innerHTML = slides.join('');
const els = [...deck.querySelectorAll('.slide')];

// viewer: one slide at a time, scaled to fit
let cur = 0;
const pos = document.getElementById('pos'), prev = document.getElementById('prev'), next = document.getElementById('next');
function fit(){
  if (document.body.dataset.mode === 'print') return;
  const s = deck.clientWidth / 1080;
  els.forEach(el => { el.style.transform = 'scale(' + s + ')'; });
}
function show(i){
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, k) => el.classList.toggle('on', k === cur));
  pos.textContent = (cur + 1) + ' / ' + els.length;
  prev.disabled = cur === 0; next.disabled = cur === els.length - 1;
}
prev.addEventListener('click', () => show(cur - 1));
next.addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
let sx = null;

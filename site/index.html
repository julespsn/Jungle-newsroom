<title>Jungle Newsroom Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: full-screen 3D jungle-office diorama; a 1930s rubber-hose cartoon HUD floats on top
   (title ribbon, crew card, edit-theme button), with film grain and vignette over everything. */
:root{
  --paper:#f1e2c0; --paper-deep:#e3c994; --ink:#1f1610; --red:#c53a2b; --mustard:#e2a634;
  --leaf:#3e6a2c; --muted:#6a5842; --ok:#3f7d3a; --warn:#b5402f;
  --display:'Rubik','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif;
  --body:'Rubik','Helvetica Neue',Arial,sans-serif;
  --type:'Rubik','Helvetica Neue',Arial,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#2a1d14;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;filter:saturate(.94) contrast(1.04);touch-action:none}

/* film treatment */
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(32,16,6,.55) 100%)}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.16;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .13  0 0 0 0 .08  0 0 0 1.4 -.25'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.flicker{position:absolute;inset:0;pointer-events:none;background:#fff3d6;opacity:0;animation:flicker 3.7s steps(1) infinite}
@keyframes flicker{0%,100%{opacity:0}31%{opacity:.035}33%{opacity:0}72%{opacity:.025}74%{opacity:0}}

/* HUD */
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud > *{pointer-events:auto}
.masthead{display:flex;flex-direction:column;gap:6px}
.masthead > :not(.ribbon-wrap){width:0;min-width:100%;box-sizing:border-box}
.ribbon-wrap{filter:drop-shadow(4px 4px 0 var(--ink))}
.ribbon{display:flex;align-items:center;gap:.4em;background:var(--red);color:var(--paper);font-family:var(--display);font-size:clamp(16px,2.4vw,24px);letter-spacing:.02em;line-height:1;
  padding:.5em 1.6em .45em;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);
  text-shadow:2px 2px 0 var(--ink);font-weight:800}
.ribbon img{height:1.05em;width:auto;display:block;filter:drop-shadow(2px 2px 0 var(--ink));transform:translateY(.06em)}
/* "Newsroom" matches the wordmark: white with an ink outline and the same offset shadow */
.ribbon span{color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:none;filter:drop-shadow(2px 2px 0 var(--ink))}
.dateline{justify-content:space-between;box-shadow:3px 3px 0 var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--type);font-weight:500;font-size:13px;display:flex;gap:8px;align-items:center}
.dateline b{font-family:var(--display);font-weight:800;color:var(--red);font-size:12px;letter-spacing:.04em}
.btn{font:inherit;font-family:var(--display);font-size:13px;letter-spacing:.03em;color:var(--paper);background:var(--leaf);border:3px solid var(--ink);border-radius:12px;
  padding:.55em 1em;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;font-weight:800}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
/* top right: open the day's carousel, replay the run */
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start;gap:10px}
a.btn{text-decoration:none;display:inline-block}
.btn.red{background:var(--red)}
.btn.paper{background:var(--paper);color:var(--ink)}
.btn[hidden]{display:none}
.btn .short{display:none}
/* the date pill steps between editions */
.dateline{padding-left:4px}
.day{display:flex;align-items:center;gap:5px}
.day-nav{font:inherit;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--ink);background:#fff8e6;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.day-nav:hover:not(:disabled){background:var(--mustard)}
.day-nav:disabled{opacity:.3;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

/* crew card */
#panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:340px;
  display:flex;flex-direction:column;min-height:0}
.card{background:var(--paper);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 50%),radial-gradient(circle at 90% 90%,rgba(160,110,50,.12),transparent 55%);
  border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink)}
#panelBody{overflow-y:auto;padding:16px 18px 18px;min-height:0;flex:1}
.sheet-handle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;font:inherit;font-family:var(--display);font-size:14px;background:none;border:none;border-bottom:2px solid var(--ink);padding:10px 16px;cursor:pointer;color:var(--ink);text-align:left;font-weight:800}
.sheet-handle .act{font-family:var(--type);font-weight:500;font-size:12px;color:var(--muted)}
.sheet-handle .act::after{content:"Hide \25B8"}
#panel.collapsed .sheet-handle .act::after{content:"Show \25C2"}
.sheet-handle:hover .act{color:var(--ink)}
#panel.collapsed{bottom:auto;width:230px}
#panel.collapsed #panelBody{display:none}
#panel.collapsed .sheet-handle{border-bottom:none}
.eyebrow{font-family:var(--type);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
#panel h2{font-family:var(--display);font-weight:800;font-size:17px;margin:14px 0 2px;letter-spacing:.01em;text-wrap:balance}
#panel h2:first-of-type{margin-top:4px}
.hint{margin:0 0 8px;color:var(--muted);font-size:13.5px;line-height:1.4}
.roster{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:rgba(255,255,255,.35);
  border:2px solid var(--ink);border-radius:12px;padding:6px 10px;cursor:pointer}
.row:hover{background:#fff6dd}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.row .who{min-width:0;line-height:1.15}
.row .who b{font-family:var(--display);font-weight:800;font-size:14px}
.row .who span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:var(--type);font-weight:500;font-size:11px;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap;background:#ddd2bb}
.chip.working{background:var(--mustard)}
.chip.done{background:#a9cf8c}
.chip.blocked{background:#f0a493}
.back{font:inherit;font-family:var(--type);font-weight:500;font-size:13px;background:none;border:none;color:var(--ink);padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.name{font-size:28px!important;margin:2px 0 0!important;line-height:1.05}
.role{margin:2px 0 10px;font-weight:700;color:var(--red)}
.job{margin:0 0 10px;line-height:1.45}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 6px;font-size:14px}
dl.facts dt{font-family:var(--type);font-weight:500;font-size:12px;color:var(--muted);padding-top:2px}
dl.facts dd{margin:0}
dl.facts .why{font-size:13px;color:var(--muted);line-height:1.35}
dl.facts .price{font-size:12px;color:var(--muted)}
dl.facts .up{display:inline-block;margin-top:5px;font-size:12.5px;line-height:1.35;border-left:3px solid var(--mustard);padding-left:7px}
.pack{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pack li{font-size:12.5px;border:1.5px dashed var(--ink);border-radius:8px;padding:2px 8px;background:rgba(255,255,255,.3)}
.stamp{display:inline-block;font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:1px 6px;transform:rotate(-3deg);margin-left:6px;vertical-align:middle;font-weight:800}
.items{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.item{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff8e6}
.item a{color:inherit;text-underline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.tags span{font-family:var(--type);font-weight:500;font-size:11px;border:1.5px solid var(--ink);border-radius:999px;padding:0 7px;background:var(--paper)}
.tags .up{background:#a9cf8c}.tags .peak{background:var(--mustard)}.tags .down{background:#d8c7a8}
.item p{margin:0;line-height:1.4;font-size:14px}
.item .idea{margin-top:4px;color:var(--muted)}
.clientbadge{margin-top:10px;display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px 14px;background:var(--c);color:#fbf6ea;font-family:var(--display);font-size:20px;letter-spacing:.03em;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.25);text-align:center;font-weight:800}
.clientbadge img{max-height:44px;max-width:100%;background:#fbf6ea;border-radius:6px;padding:4px 8px}
.empty{border:2px dashed var(--ink);border-radius:12px;padding:10px;font-size:14px;line-height:1.4;background:rgba(255,255,255,.3)}

/* theme: follows the calendar automatically; "Edit theme" overrides it for this viewer */
.theme{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.theme-btn{font:inherit;font-family:var(--display);font-size:13px;letter-spacing:.03em;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:.5em 1em;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-weight:800}
.theme-btn:hover{background:#fff6dd}
.theme-menu{order:-1;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:6px;min-width:230px}
.theme-menu button{display:flex;justify-content:space-between;gap:16px;width:100%;font:inherit;font-size:14px;font-weight:700;text-align:left;background:none;border:none;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.theme-menu button:hover{background:#fff6dd}
.theme-menu button[aria-checked="true"]{background:var(--red);color:var(--paper)}
.theme-menu small{font-family:var(--type);font-weight:500;font-weight:400;font-size:11px;opacity:.8;white-space:nowrap}
.theme-menu hr{border:none;border-top:2px dashed rgba(31,22,16,.35);margin:4px 6px}

/* ticker */
#ticker{font-family:var(--type);font-weight:300;font-size:12px;line-height:1.35;color:var(--paper);text-align:center;padding:0 6px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* floating name tags */
#labels{position:absolute;inset:0;pointer-events:none}
/* hover card: who this is and what they do, pinned above the character */
#hoverCard{position:absolute;left:0;top:0;z-index:3;pointer-events:none;width:250px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:10px 13px 11px;line-height:1.35}
#hoverCard b{display:block;font-family:var(--display);font-weight:800;font-size:17px}
#hoverCard .hc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#hoverCard .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
#hoverCard .st em{font-style:normal}
#hoverCard .st i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#c9bda5}
#hoverCard[data-s="working"] .st i{background:var(--mustard)}
#hoverCard[data-s="done"] .st i{background:#7bbf5a}
#hoverCard[data-s="blocked"] .st i{background:var(--warn)}
.tag.hovered .nm{display:none!important}
.tag.hovered .pin{opacity:0}  /* stays hoverable so the card does not flicker */
#hoverCard .r{display:block;font-weight:700;font-size:13px;color:var(--red);margin:1px 0 5px}
#hoverCard p{margin:0;font-size:13.5px;color:var(--ink)}
#hoverCard .mdl{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 9px}
#hoverCard::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;will-change:transform}
.tag .nm{pointer-events:auto;cursor:pointer;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:3px 10px 3px 7px;
  white-space:nowrap;box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;gap:7px}
.tag .nm.client{padding-left:15px;box-shadow:2px 2px 0 var(--ink),inset 7px 0 0 var(--c)}
.tag .txt{display:flex;flex-direction:column;line-height:1.08}
.tag .txt b{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.02em}
.tag .txt small{font-family:var(--type);font-weight:500;font-size:10.5px;color:var(--muted)}
.tag[data-sel="1"] .txt small{color:var(--paper)}
.tag .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:#c9bda5}
.tag[data-s="working"] .dot{background:var(--mustard)}
.tag[data-s="done"] .dot{background:#7bbf5a}
.tag[data-s="blocked"] .dot{background:var(--warn)}
.tag[data-sel="1"] .nm{background:var(--red);color:var(--paper)}
.tag:not(.full) .nm,.tag:not(.full) .bubble{display:none}
.tag.full .pin{display:none}
.pin{pointer-events:auto;cursor:pointer;width:16px;height:16px;padding:0;border-radius:50%;border:2.5px solid var(--ink);background:#c9bda5;box-shadow:0 0 0 2.5px var(--paper),2px 3px 0 2px rgba(31,22,16,.35)}
.tag[data-s="working"] .pin{background:var(--mustard);animation:pinpulse 1s ease-in-out infinite}
.tag[data-s="done"] .pin{background:#7bbf5a}
.tag[data-s="blocked"] .pin{background:var(--warn)}
@keyframes pinpulse{50%{transform:scale(1.35)}}
.bubble{font-family:var(--type);font-weight:500;font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 9px;max-width:180px;text-align:center;line-height:1.25;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble[hidden]{display:none}

/* title card */
#fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--paper);font-family:var(--type)}

@media (max-width:760px){
  #panel{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:auto;max-height:38%}
  #panel.collapsed{max-height:none;width:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .dateline{font-size:11px;white-space:nowrap;padding:3px 9px}
  #runBtn,#carouselBtn{font-size:11.5px;padding:.5em .7em}
  .btn .long{display:none}
  .btn .short{display:inline}
  .actions{gap:6px}
  .day-nav{width:20px;height:20px;font-size:13px}
  #ticker{font-size:11px}
}
@media (prefers-reduced-motion: reduce){
  .grain,.flicker,.pin{animation:none!important}
}
</style>

<div id="app">
  <div id="stage"></div>
  <div id="labels" aria-hidden="true"></div>
  <div id="hoverCard" hidden></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="flicker"></div>

  <header class="hud">
    <div class="masthead">
      <div class="ribbon-wrap"><div class="ribbon"><img src="logos/jungle-wordmark-white.png" alt="Jungle"><span>Newsroom</span></div></div>
      <div class="dateline"><span class="day"><button class="day-nav" id="prevDay" type="button" aria-label="Previous edition">‹</button><span id="dateTxt" aria-live="polite"></span><button class="day-nav" id="nextDay" type="button" aria-label="Next edition">›</button></span><b id="themeTxt"></b></div>
      <div id="ticker" role="status"></div>
    </div>
    <div class="actions">
      <a class="btn paper" id="archiveBtn" hidden>All editions</a>
      <a class="btn red" id="carouselBtn" target="_blank" rel="noopener" hidden><span class="long">Open the carousel</span><span class="short">Carousel</span> →</a>
      <button class="btn" id="runBtn" type="button">Replay<span class="long"> morning run</span></button>
    </div>
  </header>

  <aside id="panel" class="card" aria-label="Crew">
    <button class="sheet-handle" id="sheetHandle" type="button" aria-expanded="true" aria-controls="panelBody"><span>Crew &amp; desks</span><span class="act"></span></button>
    <div id="panelBody"></div>
  </aside>


  <div class="theme">
    <button class="theme-btn" id="themeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu">Edit theme</button>
    <div class="theme-menu" id="themeMenu" role="menu" hidden></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ data */

const CREW = [
  {id:'scout', name:'Mira', species:'Meerkat', role:'Scout', group:'shared', color:'#d4aa72', tier:'Fast model',
   job:'Reads the morning sources: newsletters, trade press, platform newsrooms and culture. Returns a shortlist where every item links to its original source.',
   out:'Shortlist with source links', step:'Reading this morning’s sources…', doneTxt:'Shortlist handed over'},
  {id:'trend', name:'Cam', species:'Chameleon', role:'Trend Analyst', group:'shared', color:'#6fae4a', tier:'Fast model',
   job:'Checks the momentum of every item: rising, peaking or fading, UK-only or crossing borders. Changes colour with the trends.',
   out:'A momentum tag on every item', step:'Checking what’s rising…', doneTxt:'Momentum tagged'},
  {id:'facts', name:'Tilly', species:'Tortoise', role:'Fact-checker', group:'shared', color:'#a3ad6c', tier:'Fast model',
   job:'Traces every claim, figure and date back to the original source before any desk sees it. Slow on purpose.',
   out:'Claim-by-claim check', step:'Tracing claims to the source…', doneTxt:'Every claim traced'},
  {id:'chief', name:'Sterling', species:'Silverback', role:'Editor-in-chief · Jungle desk', group:'shared', color:'#4a4441', tier:'Strong model',
   job:'Runs the floor and leads the Jungle desk: prompts for thought leadership pieces for Strategy and Data & Insight, plus quick reactive ideas for Jungle’s own social.',
   out:'The Jungle daily update', reads:'Strategy, Data & Insight', step:'Picking the Jungle angles…', doneTxt:'Jungle update ready'},
  {id:'critic', name:'Ozzie', species:'Owl', role:'Strategist · the critic', group:'shared', color:'#9c7b5b', tier:'Strong model',
   job:'Tests every angle from every desk against that client’s goals. Sends weak work back with a one-line reason. Correct but dull fails.',
   out:'Pass, rework or drop, with reasons', step:'Sending weak angles back…', doneTxt:'All angles challenged'},
  {id:'disney', name:'Pip', species:'Monkey', role:'Disney UK desk', group:'desk', color:'#4a74c9', tier:'Fast model', reads:'Social & creative team', plate:'DISNEY UK'},
  {id:'family', name:'Bo', species:'Monkey', role:'Disney Family UK desk', group:'desk', color:'#a983cf', tier:'Fast model', reads:'Social & creative team', plate:'DISNEY FAMILY UK'},
  {id:'store', name:'Lulu', species:'Monkey', role:'Disney Store UK desk', group:'desk', color:'#d4567f', tier:'Fast model', reads:'Social & creative team', plate:'DISNEY STORE'},

function themeForDate(d){
  const m = d.getMonth() + 1, md = m * 100 + d.getDate();
  if (md >= 1015 && md <= 1031) return 'halloween';
  if (md >= 1101 && md <= 1106) return 'bonfire';
  if (md >= 1201 || md <= 101) return 'festive';
  if (m <= 2) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  return 'autumn';
}

const INK = 0x1f1610;

const outlineCache = {};
function outlineMat(t){
  const k = t.toFixed(3);
  if (!outlineCache[k]) outlineCache[k] = new THREE.ShaderMaterial({
    uniforms:{uT:{value:t}}, side:THREE.BackSide,
    vertexShader:'uniform float uT; void main(){ vec3 p = position + normal * uT; gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0); }',
    fragmentShader:'void main(){ gl_FragColor = vec4(0.12,0.086,0.063,1.0); }'
  });
  return outlineCache[k];
}
const noRay = () => {};
function ink(mesh, t){
  t = t == null ? 0.022 : t;
  const g = mesh.geometry; let o;
  if (g.type === 'BoxGeometry') {
    const p = g.parameters;
    o = new THREE.Mesh(g, inkBasic);
    o.scale.set((p.width + 2*t) / p.width, (p.height + 2*t) / p.height, (p.depth + 2*t) / p.depth);
  } else {
    o = new THREE.Mesh(g, outlineMat(t));
  }
  o.raycast = noRay;
  mesh.add(o);
  return mesh;
}

/* fur: shell rendering, one shell per layer, strands from a 3D cell hash */
const FURU = {
  uSunDir:{value:new THREE.Vector3(0.45, 1, 0.4).normalize()},
  uSun:{value:new THREE.Color(1, .95, .85)},
  uAmb:{value:new THREE.Color(.55, .5, .45)}
};
const furVS = `
uniform float uLayer; uniform float uLen;
varying vec3 vPos; varying vec3 vN;
void main(){
  vPos = position;
  vN = normalize(mat3(modelMatrix) * normal);
  vec3 p = position + normal * (uLayer * uLen);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const furFS = `
uniform vec3 uColor; uniform float uLayer; uniform float uDensity;
uniform vec3 uSunDir; uniform vec3 uSun; uniform vec3 uAmb;
varying vec3 vPos; varying vec3 vN;
float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
void main(){
  vec3 q = vPos * uDensity;
  float h = hash(floor(q));
  float d = length(fract(q) - 0.5);
  if (uLayer > 0.001) {
    if (h < uLayer * 0.82) discard;
    if (d > 0.64 * (1.0 - uLayer * 0.72)) discard;
  }
  float diff = max(dot(normalize(vN), uSunDir), 0.0);
  diff = smoothstep(0.0, 1.0, diff);
  vec3 lit = uAmb * 1.3 + uSun * (0.22 + diff * 0.7);
  float ao = mix(0.74, 1.08, uLayer);
  gl_FragColor = vec4(uColor * lit * ao, 1.0);
}`;
function fur(geo, colorObj, o){
  o = Object.assign({shells:12, len:0.045, density:85}, o || {});
  const g = new THREE.Group();
  const color = {value: colorObj};
  for (let i = 0; i < o.shells; i++) {
    const m = new THREE.ShaderMaterial({
      uniforms: Object.assign({uColor:color, uLayer:{value:i / (o.shells - 1)}, uLen:{value:o.len}, uDensity:{value:o.density}}, FURU),
      vertexShader:furVS, fragmentShader:furFS
    });
    const mesh = new THREE.Mesh(geo, m);
    mesh.castShadow = i === 0;
    if (i > 0) mesh.raycast = noRay;
    g.add(mesh);
  }
  const ol = new THREE.Mesh(geo, outlineMat(o.len + 0.022));
  ol.raycast = noRay;
  g.add(ol);
  return g;
}

function canvasTex(w, h, draw){

}
function fitFont(x, text, max, start, min){
  let s = start;
  x.font = '800 ' + s + 'px Rubik, Arial, sans-serif';
  while (x.measureText(text).width > max && s > min) { s -= 2; x.font = '800 ' + s + 'px Rubik, Arial, sans-serif'; }
}
function plateTex(text, bg, fg){
  return canvasTex(512, 96, (x, w, h) => {
    x.fillStyle = bg; x.fillRect(0, 0, w, h);
    x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(9, 9, w - 18, h - 18);
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
    fitFont(x, text, 440, 50, 18);
    x.fillText(text, w / 2, h / 2 + 3);
  });
}
function plate(text, w, h, bg, fg, sideCol){
  const side = toon(sideCol || bg);
  const front = toon('#ffffff', {map:plateTex(text, bg, fg)});
  const m = new THREE.Mesh(box(w, h, 0.04), [side, side, side, side, front, side]);

  ink(m, 0.012);
  return m;
}

// images (logos) load once and repaint any texture that uses them
const IMG = {};
function withImage(url, cb){
  if (!url) return;
  if (!IMG[url]) {
    const im = new Image(); IMG[url] = {im, ready:false, cbs:[]};
    im.onload = () => { IMG[url].ready = true; IMG[url].cbs.forEach(f => f(im)); };
    im.src = url;
  }
  IMG[url].ready ? cb(IMG[url].im) : IMG[url].cbs.push(cb);
}

// platform tops use the plank texture
function plankTex(rep){
  const t = canvasTex(512, 512, (x, w, h) => {
    const cols = ['#c49460', '#b8864f', '#cc9d68', '#bb8a55'];
    const rows = 8, rh = h / rows;
    for (let r = 0; r < rows; r++) {
      let xx = -(r % 2) * 90;
      while (xx < w) {
        const len = 160 + ((r * 37 + xx) % 90);
        x.fillStyle = cols[(r + Math.floor(xx / 70)) & 3];
        x.fillRect(xx, r * rh, len, rh);
        x.strokeStyle = 'rgba(60,35,15,.35)'; x.lineWidth = 2;
        x.strokeRect(xx, r * rh, len, rh);
        xx += len;
      }
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return t;
}
function platform(x, z, r, top, rep){
  const h = top + 0.4;
  const m = mk(cyl(r, r, h, 64), [woodDark, toon('#ffffff', {map:plankTex(rep)}), woodDark], x, top - h / 2, z, world);
  m.castShadow = false; ink(m, 0.03);
  return m;
}

}

const VINE_CURVES = [];

const pulseM = basic('#ffe08a');
function boardwalk(isl){
  const a = isl.a, r0 = RING_R - 0.15, r1 = isl.R - isl.r + 0.15, len = r1 - r0, y = 0.3;
  const [mx, mz] = polar((r0 + r1) / 2, a);
  const g = new THREE.Group(); g.position.set(mx, 0, mz); g.rotation.y = Math.PI / 2 - a; world.add(g);
  const n = Math.round(len / 0.3);
  for (let i = 0; i < n; i++) ink(mk(box(1.3, 0.06, 0.24), i % 2 ? wood : woodMid, 0, y, -len / 2 + (i + 0.5) * len / n, g), 0.01);
  [-1, 1].forEach(s => {
    mk(box(0.08, 0.12, len), woodDark, s * 0.62, y - 0.08, 0, g);
    [-len / 2 + 0.1, 0, len / 2 - 0.1].forEach(pz => ink(mk(cyl(0.04, 0.05, 0.75, 8), woodDark, s * 0.66, y + 0.37, pz, g), 0.008));
    // rail as a sagging vine, in world space
    const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a)), perp = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a));
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const t = k / 8, r = r0 + 0.1 + t * (len - 0.2);
      pts.push(dir.clone().multiplyScalar(r).add(perp.clone().multiplyScalar(s * 0.66)).setY(y + 0.72 - Math.sin(t * Math.PI * 2) ** 2 * 0.16));
    }
    VINE_CURVES.push(new THREE.CatmullRomCurve3(pts));
  });
  for (let i = 0; i < 3; i++) {
    const p = mk(sph(0.09, 10, 8), pulseM, 0, 0, 0, world, {noShadow:true}); p.visible = false;
    PULSES.push({mesh:p, a, r0, r1, ph:i / 3});
  }
}

function signTex(title, sub, bg, logoUrl){
  const c = document.createElement('canvas'); c.width = 512; c.height = 200;
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const draw = img => {
    const x = c.getContext('2d'), w = 512, h = 200, band = sub ? 46 : 0;
    x.clearRect(0, 0, w, h);
    x.fillStyle = '#fbf6ea'; x.fillRect(0, 0, w, h);
    if (img) {
      const s = Math.min((w - 70) / img.width, (h - band - 36) / img.height);
      x.drawImage(img, (w - img.width * s) / 2, 18 + (h - band - 36 - img.height * s) / 2, img.width * s, img.height * s);
    } else {
      x.fillStyle = bg; x.textAlign = 'center'; x.textBaseline = 'middle';
      fitFont(x, title, 450, 60, 22); x.fillText(title, w / 2, (h - band) / 2 + 4);
    }
    if (sub) {
      x.fillStyle = bg; x.fillRect(0, h - band, w, band);
      x.fillStyle = '#fbf6ea'; x.font = '500 26px Rubik, Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(sub, w / 2, h - band / 2 + 1);
    }
    x.strokeStyle = '#1f1610'; x.lineWidth = 10; x.strokeRect(5, 5, w - 10, h - 10);
    t.needsUpdate = true;
  };
  draw(null);
  withImage(logoUrl, draw);
  return t;
}

// floating logo badges mark each area from any distance
const BADGES = [];
function badge(x, y, z, logo, ring, label, size){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const draw = img => {
    const g = c.getContext('2d');
    g.clearRect(0, 0, 256, 256);
    g.fillStyle = '#1f1610'; g.beginPath(); g.arc(128, 132, 122, 0, 7); g.fill();
    g.fillStyle = ring; g.beginPath(); g.arc(128, 126, 118, 0, 7); g.fill();
    g.fillStyle = '#fbf6ea'; g.beginPath(); g.arc(128, 126, 100, 0, 7); g.fill();
    if (img) {
      const s = Math.min(172 / img.width, 104 / img.height);
      g.drawImage(img, 128 - img.width * s / 2, 126 - img.height * s / 2, img.width * s, img.height * s);
    } else {
      g.fillStyle = ring; g.textAlign = 'center'; g.textBaseline = 'middle';
      fitFont(g, label, 160, 40, 14); g.fillText(label, 128, 130);
    }
    t.needsUpdate = true;
  };
  draw(null);
  withImage(logo, draw);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true}));
  sp.position.set(x, y, z); sp.scale.set(size, size, 1); world.add(sp);
  BADGES.push({sp, y, ph:BADGES.length * 1.3});
  return sp;
}

const footM = toon('#8f8a86');

const HITS = [];

function makeCharacter(spec){
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const furColor = new THREE.Color(spec.color);
  body.add(fur(bodyGeo, furColor));
  [-1, 1].forEach(s => {
    const a = fur(armGeo, furColor, {shells:7, len:0.035});
    a.position.set(s * 0.47, 0.47, 0.05); a.scale.set(0.8, 1.3, 0.9); a.rotation.z = s * 0.35;
    body.add(a);
  });
  [-1, 1].forEach(s => { const f = mk(footGeo, footM, s * 0.17, 0.04, 0.12, body); f.scale.set(1, 0.55, 1.3); ink(f, 0.02); });
  const face = mk(faceGeo, toon(spec.face || '#f3dcc0'), 0, 0.88, 0.33, body); face.scale.set(1, 0.82, 0.5); ink(face, 0.012);
  [-1, 1].forEach(s => {
    mk(eyeGeo, blackM, s * 0.09, 0.905, 0.449, body, {noShadow:true});
    mk(glintGeo, whiteM, s * 0.09 - 0.012, 0.918, 0.48, body, {noShadow:true});
    const bl = mk(blushGeo, blushM, s * 0.155, 0.84, 0.446, body, {noShadow:true}); bl.rotation.y = s * 0.4;
  });
  if (!spec.noSmile) { const sm = mk(smileGeo, blackM, 0, 0.835, 0.462, body, {noShadow:true}); sm.rotation.z = Math.PI; }

  const extras = {};
  const add = SPECIES[spec.species];
  if (add) add(body, furColor, extras, spec);

  const hit = new THREE.Mesh(cyl(0.6, 0.6, 1.5, 8), new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y = 0.72; hit.userData.id = spec.id; root.add(hit); HITS.push(hit);

  root.traverse(o => { if (o.isMesh && o !== hit) o.userData.id = spec.id; });
  return {root, body, furColor, extras};
}

function deskGroup(w, label, accent, fg, logo, sub){
  const g = new THREE.Group();
  ink(mk(box(w, 0.08, 0.66), wood, 0, 0.76, 0, g), 0.018);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(s => ink(mk(box(0.07, 0.72, 0.07), woodDark, s[0] * (w / 2 - 0.08), 0.36, s[1] * 0.25, g), 0.012));
  ink(mk(box(w - 0.12, 0.42, 0.04), woodMid, 0, 0.5, 0.29, g), 0.012);
  let pl;
  if (logo || sub) {
    const side = toon('#1f1610');
    pl = new THREE.Mesh(box(Math.min(w * 0.8, 1.3), 0.5, 0.04), [side, side, side, side, toon('#ffffff', {map:signTex(label, sub, accent, logo)}), side]);

  } else {
    pl = plate(label, Math.min(w * 0.72, 1.45), 0.24, accent, fg || '#f1e2c0', '#1f1610');
  }
  pl.position.set(0, 0.5, 0.33); g.add(pl);
  // monitor, turned to the side so the face stays in view
  const mon = new THREE.Group(); mon.position.set(-w / 2 + 0.32, 0.8, -0.05); mon.rotation.y = 0.5; g.add(mon);
  ink(mk(box(0.5, 0.34, 0.05), toon('#3a3330'), 0, 0.3, 0, mon), 0.012);
  mk(new THREE.PlaneGeometry(0.42, 0.26), basic('#ffffff', {map:screenTex(accent)}), 0, 0.3, 0.027, mon, {noShadow:true});
  mk(box(0.05, 0.14, 0.05), toon('#3a3330'), 0, 0.07, 0, mon);

  const mug = mk(cyl(0.05, 0.045, 0.1, 12), toon('#f1e2c0'), w / 2 - 0.25, 0.85, 0.05, g); ink(mug, 0.008);
  return g;
}
const screenCache = {};
function screenTex(accent){
  if (screenCache[accent]) return screenCache[accent];
  return screenCache[accent] = canvasTex(128, 80, (x, w, h) => {
    x.fillStyle = '#20302a'; x.fillRect(0, 0, w, h);
    x.fillStyle = accent;
    [22, 36, 30, 50, 44, 60].forEach((v, i) => x.fillRect(10 + i * 18, h - 10 - v, 12, v));
    x.fillStyle = '#f1e2c0'; x.fillRect(10, 8, 60, 6);
  });
}

Object.keys(CREW_ANGLE).forEach(id => { const [x, z] = polar(4.7, CREW_ANGLE[id]); STATIONS[id] = {pos:[x, 0, z], y:TOP_RING, rot:FACE}; });
STATIONS.chief.scale = 1.28;

// desks sit side by side across the screen; a lone desk sits just right of centre
Object.keys(ISLANDS).forEach(k => {
  const [x, z] = ISLES[k], ds = ISLANDS[k].desks;
  ds.forEach((id, i) => {
    const off = ds.length > 1 ? (i - (ds.length - 1) / 2) * 2.4 : 0.5, back = ds.length > 1 ? -0.7 : 0;

});

function build(){
  for (const c of CREW) {
    const st = STATIONS[c.id];
    const g = new THREE.Group(); g.position.set(st.pos[0], st.y, st.pos[2]); g.rotation.y = st.rot; world.add(g);
    const a = makeCharacter(c);
    a.root.scale.setScalar(st.scale || 1);
    let lift = 0;

      const crateTex = canvasTex(128, 128, (x, w, h) => {

          x.rotate(0); x.fill(); x.restore();
          x.fillStyle = '#1f1610'; x.font = '500 22px Rubik, Arial, sans-serif'; x.fillText(cc[0], cx, 250);
        });

      ink(mk(box(1.9, 1.15, 0.05), woodDark, 0, 1.55, 0, bg), 0.012);
      mk(new THREE.PlaneGeometry(1.8, 1.06), toon('#ffffff', {map:boardTex}), 0, 1.55, 0.03, bg, {noShadow:true});
      [-0.8, 0.8].forEach(px => ink(mk(box(0.06, 1.0, 0.06), woodDark, px, 0.5, 0, bg), 0.008));
    } else if (c.id === 'critic') {
      const stool = new THREE.Group(); g.add(stool);
      ink(mk(cyl(0.36, 0.36, 0.08, 20), toon('#c53a2b'), 0, 0.92, 0, stool), 0.015);
      [0, 2.1, 4.2].forEach(r => { const l = mk(cyl(0.025, 0.03, 0.92, 6), woodDark, Math.sin(r) * 0.24, 0.46, Math.cos(r) * 0.24, stool); l.rotation.set(Math.cos(r) * 0.12, 0, -Math.sin(r) * 0.12); });
      ink(mk(new THREE.TorusGeometry(0.25, 0.015, 6, 20), woodDark, 0, 0.35, 0, stool), 0.006).rotation.x = Math.PI / 2;
      lift = 0.96;
      const sign = plate('THE CRITIC', 0.9, 0.22, '#1f1610', '#f1e2c0', '#1f1610');
      sign.position.set(0.75, 0.55, 0.3); sign.rotation.y = -0.2; g.add(sign);
      ink(mk(cyl(0.02, 0.02, 0.45, 6), woodDark, 0.75, 0.22, 0.27, g), 0.006);
    } else {
      const w = c.id === 'chief' ? 2.2 : (c.id === 'facts' ? 1.6 : 1.7);
      const label = c.id === 'chief' ? 'EDITOR-IN-CHIEF' : (c.id === 'facts' ? 'FACT DESK' : c.plate);

          x.strokeStyle = '#2f6b9c'; x.lineWidth = 4;
          [96, 140, 184].forEach((y, i) => { x.beginPath(); x.moveTo(30, y); x.lineTo(30 + [250, 200, 280][i], y + (i - 1) * 3); x.stroke(); });
          x.strokeStyle = '#c53a2b'; x.lineWidth = 5; x.beginPath(); x.arc(300, 150, 34, 0, 7); x.stroke();
          x.strokeStyle = '#7a5230'; x.lineWidth = 12; x.strokeRect(6, 6, w - 12, h - 12);
        });
        const wb = new THREE.Group(); wb.position.set(-1.35, 0, -0.5); wb.rotation.y = 0.35; g.add(wb);
        mk(new THREE.PlaneGeometry(1.2, 0.8), toon('#ffffff', {map:ideasTex}), 0, 1.45, 0.03, wb, {noShadow:true});
        ink(mk(box(1.26, 0.86, 0.04), woodDark, 0, 1.45, 0, wb), 0.01);
        [-0.55, 0.55].forEach(px => ink(mk(box(0.05, 1.05, 0.05), woodDark, px, 0.52, 0, wb), 0.008));
        const pk = new THREE.Group(); pk.position.set(0.75, 0.8, 0.05); pk.scale.setScalar(0.75); d.add(pk); prop('halloween', pk);
        pumpkin(pk);
      }
    }
    a.root.position.y = lift;
    g.add(a.root);
    ACTORS[c.id] = Object.assign(a, {spec:c, station:g, baseY:lift, phase:Math.random() * 6, hover:0, state:c.blocked ? 'blocked' : 'done'});
  }
}

function pumpkin(parent){
  const om = toon('#e07b24');
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    const r = mk(sph(0.17, 14, 12), om, Math.sin(a) * 0.07, 0.16, Math.cos(a) * 0.07, parent);
    r.scale.set(0.75, 0.85, 1); r.rotation.y = a; ink(r, 0.012);
  }
  ink(mk(cyl(0.025, 0.035, 0.12, 8), toon('#4f6b2a'), 0, 0.34, 0, parent), 0.008);
  const fm = basic('#ffd35a');
  const tri = new THREE.Shape(); tri.moveTo(-0.04, 0); tri.lineTo(0.04, 0); tri.lineTo(0, 0.06); tri.closePath();
  [-1, 1].forEach(s => mk(new THREE.ShapeGeometry(tri), fm, s * 0.07, 0.2, 0.245, parent, {noShadow:true}));
  const mouth = new THREE.Shape(); mouth.moveTo(-0.1, 0); mouth.lineTo(-0.05, -0.03); mouth.lineTo(0, 0); mouth.lineTo(0.05, -0.03); mouth.lineTo(0.1, 0); mouth.lineTo(0, -0.07); mouth.closePath();
  mk(new THREE.ShapeGeometry(mouth), fm, 0, 0.14, 0.247, parent, {noShadow:true});
}
function buildSeasonal(){
  // Halloween: pumpkins, cobwebs, bats, a warm glow
  [[1.9, TOP_CORE, -1.0, 0.9], [ISLES.disney[0] + 2.4, TOP_ISLE, ISLES.disney[1] + 2.4, 1.1], [ISLES.dfs[0] + 1.4, TOP_ISLE, ISLES.dfs[1] + 0.6, 0.9]].forEach(p => {
    const g = new THREE.Group(); g.position.set(p[0], p[1], p[2]); g.scale.setScalar(p[3]); g.rotation.y = 0.6; world.add(g); prop('halloween', g); pumpkin(g);
  });
  const glow = new THREE.PointLight(0xff9a3c, 0.9, 4.5, 2); glow.position.set(ISLES.disney[0] + 2.4, 0.9, ISLES.disney[1] + 2.4); world.add(glow); prop('halloween', glow);
  function web(){
    const pts = [], n = 6, R = 0.85;
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / (n - 1) * Math.PI / 2; pts.push(0, 0, 0, Math.cos(a) * R, Math.sin(a) * R, 0); }
    for (let r = 1; r <= 4; r++) {
      const rr = r * R / 4.4;

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

// Mouse wheel zooms towards the point under the pointer (OrbitControls in r128 only zooms to the centre).
// Caught on the stage in the capture phase so OrbitControls never sees the wheel; pinch zoom is untouched.
const zoomPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOP_RING), zoomHit = new THREE.Vector3();
stage.addEventListener('wheel', e => {
  e.preventDefault(); e.stopPropagation();
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const anchor = ray.ray.intersectPlane(zoomPlane, zoomHit) ? zoomHit : controls.target;
  const dist = camera.position.distanceTo(controls.target);
  let f = Math.exp(Math.max(-1, Math.min(1, e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015))));
  f = Math.max(controls.minDistance / dist, Math.min(controls.maxDistance / dist, f));
  if (f < 1) {
    // zooming in: head towards the point under the pointer
    camera.position.sub(anchor).multiplyScalar(f).add(anchor);
    controls.target.sub(anchor).multiplyScalar(f).add(anchor);
  } else {
    // zooming out: drift back to the centre of the floor, fully centred by the home distance
    const nd = dist * f, k = dist >= homeDist ? 1 : Math.min(1, (nd - dist) / (homeDist - dist));
    const dir = camera.position.clone().sub(controls.target).normalize();
    controls.target.lerp(HOME_TARGET, k);
    camera.position.copy(controls.target).addScaledVector(dir, nd);
  }
  wantTarget.copy(controls.target); wantDist = null;
}, {capture:true, passive:false});
let downAt = null, hovered = null;
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(HITS, false)[0];
  return h ? h.object.userData.id : null;
}
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved < 6) { const id = pick(e); if (id) select(id); }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  hovered = pick(e);
  renderer.domElement.style.cursor = hovered ? 'pointer' : '';
});
$('#runBtn').addEventListener('click', runMorning);
function setPanel(open){
  $('#panel').classList.toggle('collapsed', !open);
  $('#sheetHandle').setAttribute('aria-expanded', String(open));
  applyViewOffset();
}
$('#sheetHandle').addEventListener('click', () => setPanel($('#panel').classList.contains('collapsed')));

// keep the floor centred in the space left of the crew card on wide screens (not when the card is hidden)
function applyViewOffset(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w > 760 && !$('#panel').classList.contains('collapsed')) camera.setViewOffset(w, h, 180, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  applyViewOffset();
  homeDist = camera.aspect < 0.8 ? 150 : (camera.aspect < 1.2 ? 90 : 64);
  controls.maxDistance = homeDist * 1.35;   // never zoom out far past the full floor
  if (!selected) wantDist = homeDist;
}
window.addEventListener('resize', resize);

/* ---------------------------------------------------------------- loop */

const clockT = new THREE.Clock();
const tmpV = new THREE.Vector3(), tmpW = new THREE.Vector3();
const FULL_TAG_DIST = 26;
const hoverCard = $('#hoverCard');
let cardFor = null;
const chamA = new THREE.Color('#6fae4a'), chamB = new THREE.Color('#d9a33a'), chamC = new THREE.Color('#4a8fc9');
function tick(){
  const dt = Math.min(clockT.getDelta(), 0.05), t = clockT.elapsedTime;

  // camera easing toward the selected crew member
  const off = camera.position.clone().sub(controls.target);
  controls.target.lerp(wantTarget, 0.07);
  if (wantDist != null) {
    const d = off.length(), nd = d + (wantDist - d) * 0.07;
    off.setLength(nd);
    if (Math.abs(nd - wantDist) < 0.05) wantDist = null;
  }
  camera.position.copy(controls.target).add(off);
  controls.update();

  for (const id in ACTORS) {
    const a = ACTORS[id];
    const sp = REDUCE ? 0 : 1;
    const breathe = Math.sin(t * 2 + a.phase) * 0.018 * sp;
    let hop = 0;
    if (a.state === 'working') hop = Math.abs(Math.sin(t * 7 + a.phase)) * 0.09 * sp;
    if (a.state === 'idle') a.body.rotation.z = Math.sin(t * 1.2 + a.phase) * 0.06 * sp; else a.body.rotation.z *= 0.9;
    a.hover += ((hovered === id || selected === id ? 1 : 0) - a.hover) * 0.15;
    a.body.scale.set(1 - breathe * 0.5, 1 + breathe, 1 - breathe * 0.5);
    a.body.position.y = hop + a.hover * 0.08;
  }
  // chameleon shifts colour
  const cam = ACTORS.trend;
  if (cam) {
    const k = (Math.sin(t * 0.5) + 1) / 2, k2 = (Math.sin(t * 0.31 + 1) + 1) / 2;
    cam.furColor.copy(chamA).lerp(chamB, k * 0.55).lerp(chamC, k2 * 0.35);
    if (cam.extras.tailMat) cam.extras.tailMat.color.copy(cam.furColor);
  }

  // clock shows real time
  const now = new Date(), mins = now.getMinutes() + now.getSeconds() / 60, hrs = (now.getHours() % 12) + mins / 60;
  minHand.rotation.z = -mins / 60 * Math.PI * 2;
  hourHand.rotation.z = -hrs / 12 * Math.PI * 2;

  orb.lookAt(camera.position);

  // glowing dots run out along the boardwalks while the client desks work
  PULSES.forEach(p => {
    p.mesh.visible = pulseOn;
    if (!pulseOn) return;
    const k = (t * 0.45 + p.ph) % 1, r = p.r0 + (p.r1 - p.r0) * k;
    p.mesh.position.set(Math.cos(p.a) * r, 0.62 + Math.sin(k * Math.PI) * 0.15, Math.sin(p.a) * r);
  });

  if (faller) {
    const {mesh, parts, f} = faller;
    parts.forEach((p, i) => {
      p.y -= f.speed * p.s * dt;
      if (p.y < 0.1) { p.y = 9 + Math.random(); p.x = (-10.5 + Math.random() * 20) * FX_SCALE; p.z = (-8.8 + Math.random() * 16) * FX_SCALE; }
      dummy.position.set(p.x + Math.sin(t * 0.9 + p.ph) * 0.35, p.y, p.z + Math.cos(t * 0.7 + p.ph) * 0.2);
      if (f.spin) dummy.rotation.set(t * 1.3 + p.r, t * 0.9 + p.ph, p.r); else dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(p.s);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
  }

  if (PROPS.halloween[0] && PROPS.halloween[0].visible) {
    BATS.forEach(b => {
      const a = t * 0.5 + b.ph;
      b.g.position.set(b.cx + Math.cos(a) * b.r, b.cy + Math.sin(t * 1.3 + b.ph) * 0.3, b.cz + Math.sin(a) * b.r * 0.5);
      b.g.rotation.y = -a;
      const flap = Math.sin(t * 14 + b.ph) * 0.8;
      b.R.rotation.y = flap; b.L.rotation.y = -flap;
    });
  }

  if (FW.geo && PROPS.fireworks[0].visible) {
    const pos = FW.geo.attributes.position.array, col = FW.geo.attributes.color.array;
    FW.bursts.forEach((b, bi) => {
      b.t += dt;
      if (b.t > 2.4) {
        b.t = 0;
        b.c.set((-6 + Math.random() * 11) * FX_SCALE, 6.5 + Math.random() * 2.5, (-9 + Math.random() * 3) * FX_SCALE);
        b.color = FW.palette[Math.floor(Math.random() * FW.palette.length)];
      }
      const life = b.t < 0 ? 0 : Math.max(0, 1 - b.t / 2.4);
      for (let i = 0; i < FW.P; i++) {
        const j = (bi * FW.P + i) * 3, v = b.vel[i], tt = Math.max(0, b.t);
        pos[j] = b.c.x + v.x * tt; pos[j + 1] = b.c.y + v.y * tt - 0.9 * tt * tt; pos[j + 2] = b.c.z + v.z * tt;
        col[j] = b.color.r * life; col[j + 1] = b.color.g * life; col[j + 2] = b.color.b * life;
      }
    });
    FW.geo.attributes.position.needsUpdate = true; FW.geo.attributes.color.needsUpdate = true;
  }

  if (LIGHTS.mesh && LIGHTS.mesh.visible) {
    const c = new THREE.Color();
    LIGHTS.base.forEach((b, i) => {
      const k = REDUCE ? 1 : 0.55 + 0.45 * Math.max(0, Math.sin(t * 2.2 + i * 1.7));
      c.copy(b).multiplyScalar(k);
      LIGHTS.mesh.setColorAt(i, c);
    });
    LIGHTS.mesh.instanceColor.needsUpdate = true;
  }

  // name tags follow their crew member
  const r = renderer.domElement.getBoundingClientRect();
  let hx = 0, hy = 0;
  for (const id in ACTORS) {
    const a = ACTORS[id];
    a.root.getWorldPosition(tmpV);
    tmpV.y += 1.27 * (STATIONS[id].scale || 1) + 0.28 + a.body.position.y;
    tmpV.project(camera);
    const x = (tmpV.x + 1) / 2 * r.width, y = (1 - tmpV.y) / 2 * r.height;
    TAGS[id].el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-100%)';
    // full name card only up close, on hover or when selected; otherwise a small status pin
    const full = hovered === id || selected === id || camera.position.distanceTo(a.root.getWorldPosition(tmpW)) < FULL_TAG_DIST;
    if (TAGS[id].full !== full) { TAGS[id].full = full; TAGS[id].el.classList.toggle('full', full); }
    TAGS[id].el.classList.toggle('hovered', id === hovered);
    if (id === hovered) { hx = x; hy = y; }
  }
  // hover card above whoever is hovered, on the floor or in the crew list
  if (hovered !== cardFor) {
    cardFor = hovered;
    if (hovered && byId[hovered]) {
      const c = byId[hovered];
      hoverCard.innerHTML = '<div class="hc-top"><b>' + c.name + '</b><span class="st"><i></i><em></em></span></div><span class="r">' + c.role + '</span><p>' + c.job.split('. ')[0].replace(/\.$/, '') + '.</p><span class="mdl">' + c.model.name + ' \u00b7 ' + c.model.effort + ' effort</span>';
    }
    hoverCard.dataset.s = '';
    hoverCard.hidden = !cardFor;
  }
  if (cardFor) {
    hoverCard.style.transform = 'translate(' + hx.toFixed(1) + 'px,' + (hy - 6).toFixed(1) + 'px) translate(-50%,-100%)';
    const st = ACTORS[cardFor].state;
    if (hoverCard.dataset.s !== st) { hoverCard.dataset.s = st; hoverCard.querySelector('.st em').textContent = STATUS_TXT[st]; }
  }

  BADGES.forEach(b => { b.sp.position.y = b.y + (REDUCE ? 0 : Math.sin(t * 1.1 + b.ph) * 0.12); });

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------- start */

function start(){
  build();
  buildSeasonal();
  buildThemeMenu();
  buildTags();
  applyTheme(TODAY_THEME);
  showEdition(edIdx);
  if (matchMedia('(max-width:760px)').matches) { $('#panel').classList.add('collapsed'); $('#sheetHandle').setAttribute('aria-expanded', 'false'); }
  resize();
  camera.position.copy(HOME_TARGET).add(new THREE.Vector3(1, 1.3, 1).setLength(homeDist));
  tick();
}
const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 40px Rubik'), document.fonts.load('500 20px Rubik')]) : Promise.resolve();
Promise.race([fontsReady, wait(2500)]).catch(() => {}).then(start);
})();
</script>

<title>Jungle Newsroom Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Alegreya+Sans:wght@400;500;700;800&family=Special+Elite&display=swap">
<style>
/* Layout: a morning carousel of 1080x1350 slides in the newsroom's 1930s cartoon style.
   Viewer mode (default) shows one slide at a time; print mode (set by render.js) stacks them for PNG/PDF export. */
:root{
  --paper:#f1e2c0; --paper-2:#e8d3a6; --ink:#1f1610; --red:#c53a2b; --mustard:#e2a634; --leaf:#3f6b2e; --muted:#6a5842;
  --up:#7bbf5a; --peak:#e2a634; --down:#c9bda5;
  --display:'Ultra','Rockwell Extra Bold',Georgia,serif;
  --body:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
  --type:'Special Elite','Courier New',monospace;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#2a1d14;color:var(--ink);font-family:var(--body)}

.slide{position:relative;width:1080px;height:1350px;box-sizing:border-box;padding:96px 84px 84px;overflow:hidden;background:var(--paper);
  background-image:radial-gradient(circle at 18% 8%,rgba(255,255,255,.45),transparent 45%),radial-gradient(circle at 90% 95%,rgba(150,100,40,.16),transparent 55%)}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .13  0 0 0 0 .08  0 0 0 1.3 -.25'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.slide::after{content:"";position:absolute;inset:26px;border:6px solid var(--ink);border-radius:40px;pointer-events:none}
.slide > *{position:relative;z-index:1}

.top{position:absolute;top:58px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-family:var(--type);font-size:26px;color:var(--muted)}
.top b{font-family:var(--display);font-weight:400;color:var(--red);font-size:24px;letter-spacing:.04em}
.foot{position:absolute;left:84px;right:84px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;font-family:var(--type);font-size:23px;color:var(--muted)}
.foot .check{white-space:nowrap;color:var(--leaf)}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#e8cf9c}
.cover .rays{position:absolute;left:50%;top:46%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;z-index:0;
  background:repeating-conic-gradient(from 0deg,#efd8a6 0deg 7.5deg,#dcb97a 7.5deg 15deg)}
.cover .plaque{background:var(--paper);border:7px solid var(--ink);border-radius:44px;box-shadow:14px 14px 0 var(--ink);padding:56px 60px 50px;width:100%;box-sizing:border-box}
.cover .pre{font-family:var(--type);font-size:30px;letter-spacing:.14em;text-transform:uppercase;margin:0}
.cover h1{font-family:var(--display);font-weight:400;font-size:112px;line-height:.92;margin:18px 0 10px;color:var(--red);text-shadow:6px 6px 0 var(--ink)}
.cover .edition{display:inline-block;font-family:var(--display);font-size:34px;color:var(--paper);background:var(--leaf);border:5px solid var(--ink);border-radius:999px;padding:8px 30px;margin:4px 0 8px}
.cover .date{font-family:var(--display);font-size:46px;margin:6px 0 26px}
.cover ol{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:14px;counter-reset:s}
.cover li{counter-increment:s;display:grid;grid-template-columns:62px 1fr;gap:16px;align-items:center;font-size:33px;line-height:1.18;font-weight:700}
.cover li::before{content:counter(s);display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:28px}
.cover .season{position:absolute;top:110px;right:96px;transform:rotate(6deg);font-family:var(--display);font-size:26px;color:var(--paper);background:var(--red);border:5px solid var(--ink);border-radius:14px;padding:10px 20px;z-index:2}

/* story */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:40px 0 26px}
.chip{font-family:var(--type);font-size:27px;border:3.5px solid var(--ink);border-radius:999px;padding:5px 20px;background:var(--paper)}
.chip.up{background:var(--up)} .chip.peak{background:var(--peak)} .chip.down{background:var(--down)}
.story h2{font-family:var(--display);font-weight:400;font-size:76px;line-height:1.0;margin:0 0 30px;color:var(--red);text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.story .what{font-size:37px;line-height:1.36;margin:0 0 30px;max-width:30ch}
.why{background:#fff8e6;border:5px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);padding:26px 32px}
.why .lbl{font-family:var(--display);font-size:26px;letter-spacing:.05em;color:var(--leaf);margin:0 0 6px}
.why p{margin:0;font-size:33px;line-height:1.34}
.desks{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;align-items:center;font-family:var(--type);font-size:24px;color:var(--muted)}
.desks span.d{display:inline-flex;align-items:center;gap:9px;border:3px solid var(--ink);border-radius:999px;padding:4px 16px 4px 8px;background:var(--paper);color:var(--ink)}
.desks span.d i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);background:var(--c)}
.num{position:absolute;right:84px;top:120px;font-family:var(--display);font-size:150px;line-height:1;color:var(--paper-2);text-shadow:4px 4px 0 rgba(31,22,16,.18);z-index:0}

/* desk */
.desk .head{display:flex;align-items:center;gap:26px;margin:40px 0 34px}
.desk .badge{width:150px;height:150px;border-radius:50%;background:var(--c);border:6px solid var(--ink);display:grid;place-items:center;flex:none}
.desk .badge span{width:118px;height:118px;border-radius:50%;background:#fbf6ea;display:grid;place-items:center;overflow:hidden}
.desk .badge img{max-width:92px;max-height:64px}
.desk .badge b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--c);text-align:center;line-height:1}
.desk h2{font-family:var(--display);font-weight:400;font-size:62px;line-height:1;margin:0}
.desk .who{font-family:var(--type);font-size:27px;color:var(--muted);margin:8px 0 0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:24px}
.ideas li{border:5px solid var(--ink);border-left:22px solid var(--c);border-radius:24px;background:#fff8e6;padding:22px 28px}
.ideas .from{font-family:var(--type);font-size:24px;color:var(--muted);margin:0 0 8px}
.ideas .idea{font-size:35px;line-height:1.3;margin:0;font-weight:700}
.ideas .note{font-size:28px;line-height:1.3;margin:8px 0 0;color:var(--muted)}

/* end */
.end{display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--ink);color:var(--paper)}
.end::after{border-color:var(--paper)}
.end h2{font-family:var(--display);font-weight:400;font-size:96px;line-height:.95;margin:0 0 30px;color:var(--mustard);text-shadow:5px 5px 0 #000}
.end p{font-size:36px;line-height:1.4;margin:0 auto 18px;max-width:26ch}
.end .stamps{display:flex;justify-content:center;gap:20px;margin:30px 0}
.end .stamps span{font-family:var(--display);font-size:30px;border:5px solid;border-radius:14px;padding:8px 20px;transform:rotate(-4deg)}
.end .link{font-family:var(--type);font-size:26px;color:#d9c7a0;word-break:break-all}

/* viewer (artifact) */
body:not([data-mode="print"]){min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
body:not([data-mode="print"]) #deck{position:relative;width:min(540px,100%);aspect-ratio:1080/1350;max-height:calc(100vh - 120px)}
body:not([data-mode="print"]) .slide{position:absolute;top:0;left:0;transform-origin:top left;display:none}
body:not([data-mode="print"]) .slide.on{display:flex}
body:not([data-mode="print"]) .slide.on:not(.cover):not(.end){display:block}
.nav{display:flex;align-items:center;gap:14px;font-family:var(--type);color:var(--paper)}
.nav button{font-family:var(--display);font-size:16px;color:var(--paper);background:var(--red);border:3px solid var(--paper);border-radius:12px;padding:8px 16px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
body[data-mode="print"] .nav{display:none}
body[data-mode="print"] #deck{display:block}
body[data-mode="print"] .slide{page-break-after:always;break-after:page}
@page{size:1080px 1350px;margin:0}
</style>

<div id="deck"></div>
<div class="nav"><button id="prev" type="button">Back</button><span id="pos"></span><button id="next" type="button">Next</button></div>

<script id="edition" type="application/json">{}</script>
<script>
(function(){
const E = JSON.parse(document.getElementById('edition').textContent || '{}');
const deck = document.getElementById('deck');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DESKS = Object.fromEntries((E.desks || []).map(d => [d.id, d]));
const MOM = {Rising:'up', Peaking:'peak', Fading:'down'};
const slides = [];
const top = (n) => '<div class="top"><b>THE JUNGLE NEWSROOM</b><span>' + esc(E.dateLabel) + ' · ' + n + '</span></div>';

slides.push('<section class="slide cover"><div class="rays"></div>' +
  (E.season ? '<div class="season">' + esc(E.season) + '</div>' : '') +
  '<div class="plaque"><p class="pre">Jungle Creations presents</p><h1>The Jungle Newsroom</h1>' +
  (E.edition ? '<p class="edition">' + esc(E.edition) + '</p>' : '') +
  '<p class="date">' + esc(E.dateLabel) + '</p><ol>' + (E.stories || []).map(s => '<li>' + esc(s.short || s.headline) + '</li>').join('') + '</ol></div></section>');

(E.stories || []).forEach((s, i) => {
  slides.push('<section class="slide story">' + top('Story ' + (i + 1)) + '<div class="num">' + String(i + 1).padStart(2, '0') + '</div>' +
    '<div class="chips"><span class="chip ' + (MOM[s.momentum] || '') + '">' + esc(s.momentum) + '</span><span class="chip">' + esc(s.region) + '</span><span class="chip">' + esc(s.platform) + '</span></div>' +
    '<h2>' + esc(s.headline) + '</h2><p class="what">' + esc(s.what) + '</p>' +
    '<div class="why"><p class="lbl">WHY IT MATTERS</p><p>' + esc(s.why) + '</p></div>' +
    (s.desks && s.desks.length ? '<div class="desks">Picked up by ' + s.desks.map(id => DESKS[id] ? '<span class="d" style="--c:' + DESKS[id].color + '"><i></i>' + esc(DESKS[id].short) + '</span>' : '').join('') + '</div>' : '') +
    '<div class="foot"><span>Source: ' + esc(s.source) + '</span><span class="check">Checked by Tilly ✓</span></div></section>');
});

(E.desks || []).forEach(d => {
  if (!d.ideas || !d.ideas.length) return;
  slides.push('<section class="slide desk" style="--c:' + d.color + '">' + top(esc(d.short)) +
    '<div class="head"><div class="badge"><span>' + (d.logo ? '<img src="' + esc(d.logo) + '" alt="' + esc(d.name) + '">' : '<b>' + esc(d.short) + '</b>') + '</span></div>' +
    '<div><h2>' + esc(d.title || ('For ' + d.name)) + '</h2><p class="who">' + esc(d.byline) + '</p></div></div>' +
    '<ul class="ideas">' + d.ideas.map(it => '<li><p class="from">' + esc(it.from) + '</p><p class="idea">' + esc(it.idea) + '</p>' + (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') + '</li>').join('') + '</ul>' +
    '<div class="foot"><span>' + esc(d.footer || 'Ideas, not approved posts') + '</span><span class="check">Challenged by Ozzie ✓</span></div></section>');
});

slides.push('<section class="slide end"><h2>That’s the morning run</h2>' +
  '<p>Nothing here is approved yet. Take a seat at the review desk.</p>' +
  '<div class="stamps"><span style="color:#7bbf5a">APPROVE</span><span style="color:#e2a634">CHANGE</span><span style="color:#e86a5a">DROP</span></div>' +
  (E.floorUrl ? '<p class="link">Visit the floor: ' + esc(E.floorUrl) + '</p>' : '') + '</section>');

deck.innerHTML = slides.join('');
const els = [...deck.querySelectorAll('.slide')];

// viewer: one slide at a time, scaled to fit
let cur = 0;
const pos = document.getElementById('pos'), prev = document.getElementById('prev'), next = document.getElementById('next');
function fit(){
  if (document.body.dataset.mode === 'print') return;
  const s = deck.clientWidth / 1080;
  els.forEach(el => { el.style.transform = 'scale(' + s + ')'; });
}
function show(i){
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, k) => el.classList.toggle('on', k === cur));
  pos.textContent = (cur + 1) + ' / ' + els.length;
  prev.disabled = cur === 0; next.disabled = cur === els.length - 1;
}
prev.addEventListener('click', () => show(cur - 1));
next.addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
let sx = null;
deck.addEventListener('pointerdown', e => { sx = e.clientX; });
deck.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 40) show(cur + (e.clientX < sx ? 1 : -1)); sx = null; });
window.addEventListener('resize', fit);
fit(); show(0);
})();
</script>

<title>Jungle Newsroom Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: 1080x1350 slides in Jungle's Instagram carousel style (dark concrete texture, hairline top bar,
   huge bold sans, neon green for the key words, white for the rest, lowercase jungle wordmark bottom right).
   Viewer mode (default) shows one slide at a time; print mode (set by render.js) stacks them for PNG/PDF export. */
:root{
  --bg:#3b3936; --bg-2:#2c2a28; --white:#ffffff; --soft:#d9d6d0; --dim:#a8a39b; --green:#7ef25c; --amber:#ffc94a; --grey:#8d8880;
  --sans:'Manrope','Helvetica Neue',Arial,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#161514;color:var(--white);font-family:var(--sans)}

.slide{position:relative;width:1080px;height:1350px;box-sizing:border-box;padding:150px 76px 150px;overflow:hidden;background:var(--bg);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(0,0,0,.35),transparent 60%)}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.slide > *{position:relative;z-index:1}
em{font-style:normal;color:var(--green)}

.bar{position:absolute;top:56px;left:76px;right:76px;display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:2px solid rgba(255,255,255,.55);
  font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.bar span:last-child{text-transform:none;font-weight:600}
.mark{position:absolute;right:66px;bottom:52px;font-size:62px;font-weight:800;letter-spacing:-.045em;line-height:1}
.src{position:absolute;left:76px;bottom:64px;max-width:640px;font-size:22px;font-weight:600;color:var(--dim);line-height:1.35}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center}
.cover .kick{font-size:34px;font-weight:700;color:var(--soft);margin:0 0 6px}
.cover h1{font-size:150px;font-weight:800;line-height:.9;letter-spacing:-.045em;margin:0;color:var(--green)}
.cover .sub{font-size:76px;font-weight:800;line-height:.98;letter-spacing:-.035em;margin:6px 0 46px}
.cover ol{list-style:none;margin:0;padding:0;display:grid;gap:18px;counter-reset:s}
.cover li{counter-increment:s;display:grid;grid-template-columns:58px 1fr;gap:18px;align-items:baseline;font-size:34px;font-weight:700;line-height:1.2;color:var(--soft)}
.cover li::before{content:counter(s, decimal-leading-zero);font-size:26px;font-weight:800;color:var(--green)}

/* story */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 34px}
.chip{font-size:24px;font-weight:700;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 20px;color:var(--soft)}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.peak{border-color:var(--amber);color:var(--amber)}
.chip.down{border-color:var(--grey);color:var(--grey)}
.story h2{font-size:84px;font-weight:800;line-height:.98;letter-spacing:-.04em;margin:0 0 34px;text-wrap:balance}
.story .what{font-size:34px;font-weight:500;line-height:1.38;margin:0 0 36px;color:var(--soft);max-width:31ch}
.why{border-left:6px solid var(--green);padding:4px 0 4px 28px}
.why .lbl{font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--green);margin:0 0 8px}
.why p{margin:0;font-size:32px;font-weight:600;line-height:1.36}
.desks{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;align-items:center;font-size:22px;font-weight:700;color:var(--dim)}
.desks span.d{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 18px 6px 10px;color:var(--white)}
.desks span.d i{width:18px;height:18px;border-radius:50%;background:var(--c)}

/* desk */
.desk .head{display:flex;align-items:center;gap:30px;margin:0 0 44px}
.desk .tile{width:170px;height:170px;border-radius:30px;background:var(--white);display:grid;place-items:center;flex:none;box-shadow:inset 0 -10px 0 var(--c)}
.desk .tile img{max-width:128px;max-height:84px;margin-bottom:8px}
.desk .tile b{font-size:28px;font-weight:800;color:var(--c);text-align:center}
.desk h2{font-size:72px;font-weight:800;line-height:.96;letter-spacing:-.04em;margin:0}
.desk .who{font-size:26px;font-weight:600;color:var(--dim);margin:12px 0 0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.ideas li{background:rgba(0,0,0,.28);border-radius:28px;padding:28px 32px;border-top:6px solid var(--c)}
.ideas .from{font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.ideas .idea{font-size:36px;font-weight:800;line-height:1.22;letter-spacing:-.01em;margin:0}
.ideas .note{font-size:28px;font-weight:500;line-height:1.35;margin:10px 0 0;color:var(--soft)}

/* end */
.end{display:flex;flex-direction:column;justify-content:center}
.end h2{font-size:120px;font-weight:800;line-height:.92;letter-spacing:-.045em;margin:0 0 34px}
.end p{font-size:38px;font-weight:600;line-height:1.36;margin:0 0 20px;color:var(--soft);max-width:24ch}
.end .acts{display:flex;gap:16px;margin:26px 0 30px}
.end .acts span{font-size:28px;font-weight:800;border-radius:999px;padding:12px 30px;color:#1d1c1a}
.end .link{font-size:24px;font-weight:600;color:var(--dim);word-break:break-all}

/* viewer (artifact) */
body:not([data-mode="print"]){min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
body:not([data-mode="print"]) #deck{position:relative;width:min(540px,100%);aspect-ratio:1080/1350}
body:not([data-mode="print"]) .slide{position:absolute;top:0;left:0;transform-origin:top left;display:none}
body:not([data-mode="print"]) .slide.on{display:block}
body:not([data-mode="print"]) .slide.on.cover,body:not([data-mode="print"]) .slide.on.end{display:flex}
.nav{display:flex;align-items:center;gap:14px;font-weight:700;color:var(--soft)}
.nav button{font:inherit;font-weight:800;color:#1d1c1a;background:var(--green);border:none;border-radius:999px;padding:10px 22px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
body[data-mode="print"] .nav{display:none}
body[data-mode="print"] .slide{page-break-after:always;break-after:page}
@page{size:1080px 1350px;margin:0}
</style>

<div id="deck"></div>
<div class="nav"><button id="prev" type="button">Back</button><span id="pos"></span><button id="next" type="button">Next</button></div>

<script id="edition" type="application/json">{}</script>
<script>
(function(){
const E = JSON.parse(document.getElementById('edition').textContent || '{}');
const deck = document.getElementById('deck');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *words* in headlines are set in Jungle green
const hi = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = s => String(s == null ? '' : s).replace(/\*/g, '');
const DESKS = Object.fromEntries((E.desks || []).map(d => [d.id, d]));
const MOM = {Rising:'up', Peaking:'peak', Fading:'down'};
const edition = E.edition || 'The daily';
const bar = right => '<div class="bar"><span>' + esc(edition) + '</span><span>' + esc(right) + '</span></div>';
const mark = '<div class="mark">jungle</div>';
const slides = [];

slides.push('<section class="slide cover">' + bar('The Jungle Newsroom · ' + (E.dateLabel || '')) +
  '<p class="kick">The Jungle Newsroom</p><h1>' + hi(E.coverTitle || edition) + '</h1>' +
  '<p class="sub">' + hi(E.coverSub || 'what’s moving on social') + '</p>' +
  '<ol>' + (E.stories || []).map(s => '<li>' + esc(plain(s.short || s.headline)) + '</li>').join('') + '</ol>' + mark + '</section>');

(E.stories || []).forEach((s, i) => {
  slides.push('<section class="slide story">' + bar('Story ' + String(i + 1).padStart(2, '0') + ' · ' + (E.dateLabel || '')) +
    '<div class="chips"><span class="chip ' + (MOM[s.momentum] || '') + '">' + esc(s.momentum) + '</span><span class="chip">' + esc(s.region) + '</span><span class="chip">' + esc(s.platform) + '</span></div>' +
    '<h2>' + hi(s.headline) + '</h2><p class="what">' + esc(s.what) + '</p>' +
    '<div class="why"><p class="lbl">WHY IT MATTERS</p><p>' + esc(s.why) + '</p></div>' +
    (s.desks && s.desks.length ? '<div class="desks">For ' + s.desks.map(id => DESKS[id] ? '<span class="d" style="--c:' + DESKS[id].color + '"><i></i>' + esc(DESKS[id].short) + '</span>' : '').join('') + '</div>' : '') +
    '<div class="src">Source: ' + esc(s.source) + ' · fact-checked</div>' + mark + '</section>');
});

(E.desks || []).forEach(d => {
  if (!d.ideas || !d.ideas.length) return;
  slides.push('<section class="slide desk" style="--c:' + d.color + '">' + bar(d.short + ' desk') +
    '<div class="head"><div class="tile">' + (d.logo ? '<img src="' + esc(d.logo) + '" alt="' + esc(d.name) + '">' : '<b>' + esc(d.short) + '</b>') + '</div>' +
    '<div><h2>' + hi(d.title || ('For *' + d.name + '*')) + '</h2><p class="who">' + esc(d.byline) + '</p></div></div>' +
    '<ul class="ideas">' + d.ideas.map(it => '<li><p class="from">' + esc(it.from) + '</p><p class="idea">' + esc(it.idea) + '</p>' + (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') + '</li>').join('') + '</ul>' +
    '<div class="src">Ideas, not approved posts</div>' + mark + '</section>');
});

slides.push('<section class="slide end">' + bar('The Jungle Newsroom') +
  '<h2>That’s the <em>morning run.</em></h2>' +
  '<p>Nothing here is approved yet. Tell us what to keep, change or drop.</p>' +
  '<div class="acts"><span style="background:var(--green)">Keep</span><span style="background:var(--amber)">Change</span><span style="background:var(--soft)">Drop</span></div>' +
  (E.floorUrl ? '<p class="link">Visit the floor: ' + esc(E.floorUrl) + '</p>' : '') + mark + '</section>');

deck.innerHTML = slides.join('');
const els = [...deck.querySelectorAll('.slide')];

// viewer: one slide at a time, scaled to fit
let cur = 0;
const pos = document.getElementById('pos'), prev = document.getElementById('prev'), next = document.getElementById('next');
function fit(){
  if (document.body.dataset.mode === 'print') return;
  const s = deck.clientWidth / 1080;
  els.forEach(el => { el.style.transform = 'scale(' + s + ')'; });
}
function show(i){
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, k) => el.classList.toggle('on', k === cur));
  pos.textContent = (cur + 1) + ' / ' + els.length;
  prev.disabled = cur === 0; next.disabled = cur === els.length - 1;
}
prev.addEventListener('click', () => show(cur - 1));
next.addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
let sx = null;
deck.addEventListener('pointerdown', e => { sx = e.clientX; });
deck.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 40) show(cur + (e.clientX < sx ? 1 : -1)); sx = null; });
window.addEventListener('resize', fit);
fit(); show(0);
})();
</script>

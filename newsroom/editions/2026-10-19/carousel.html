<title>Jungle Newsroom Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 1080x1350 slides in Jungle's Instagram carousel style (dark concrete texture, hairline top bar,
   Poppins, Jungle green for the key words, the jungle wordmark bottom right). Story slides lead with a picture.
   Viewer mode (default) shows one slide at a time; print mode (set by render.js) stacks them for PNG/PDF export. */
:root{
  --bg:#3b3936; --white:#ffffff; --soft:#dedad3; --dim:#aaa59d; --green:#7ef25c; --amber:#ffc94a; --grey:#8d8880;
  --sans:'Poppins','Helvetica Neue',Arial,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#161514;color:var(--white);font-family:var(--sans)}
a{color:inherit}

.slide{position:relative;width:1080px;height:1350px;box-sizing:border-box;padding:136px 76px 150px;overflow:hidden;background:var(--bg);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(0,0,0,.35),transparent 60%)}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.slide > *{position:relative;z-index:1}
em{font-style:normal;color:var(--green)}

.bar{position:absolute;top:52px;left:76px;right:76px;display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.55);
  font-size:21px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.bar span:last-child{text-transform:none;font-weight:500}
.mark{position:absolute;right:70px;bottom:56px;height:52px}
.mark img{height:100%;display:block}
.foot{position:absolute;left:76px;bottom:58px;max-width:700px;font-size:19px;line-height:1.45;color:var(--dim)}
.foot a{color:var(--green);text-decoration:none;font-weight:600;word-break:break-all}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center}
.cover .kick{font-size:28px;font-weight:600;color:var(--soft);margin:0 0 4px}
.cover h1{font-size:132px;font-weight:800;line-height:.95;letter-spacing:-.04em;margin:0;color:var(--green)}
.cover .sub{font-size:62px;font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:8px 0 44px}
.cover h3{font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:22px 0 10px}
.cover ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cover li{font-size:27px;font-weight:500;line-height:1.25;color:var(--soft);padding-left:26px;position:relative}
.cover li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--green)}

/* story */
.pic{height:500px;border-radius:30px;overflow:hidden;background:#222;margin:0 0 30px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.chip{font-size:19px;font-weight:600;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 16px;color:var(--soft)}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.peak{border-color:var(--amber);color:var(--amber)}
.chip.down{border-color:var(--grey);color:var(--grey)}
.story h2{font-size:56px;font-weight:700;line-height:1.08;letter-spacing:-.03em;margin:0 0 18px;text-wrap:balance}
.story .what{font-size:25px;font-weight:400;line-height:1.5;margin:0 0 20px;color:var(--soft)}
.why{border-left:5px solid var(--green);padding:2px 0 2px 22px}
.why p{margin:0;font-size:24px;font-weight:500;line-height:1.45}
.why b{color:var(--green);font-weight:700}

/* watch list */
.watch h2{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:30px 0 44px}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.wl li{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(0,0,0,.25);border-radius:26px;padding:24px 28px}
.wl .when{font-size:20px;font-weight:700;color:#1d1c1a;background:var(--green);border-radius:999px;text-align:center;padding:6px 10px;align-self:start}
.wl .t{font-size:29px;font-weight:700;line-height:1.2;margin:0}
.wl .n{font-size:22px;font-weight:400;line-height:1.45;margin:6px 0 0;color:var(--soft)}

/* desk */
.desk .head{display:flex;align-items:center;gap:28px;margin:12px 0 34px}
.desk .tile{width:150px;height:150px;border-radius:28px;background:var(--white);display:grid;place-items:center;flex:none;box-shadow:inset 0 -10px 0 var(--c)}
.desk .tile img{max-width:112px;max-height:74px;margin-bottom:8px}
.desk h2{font-size:58px;font-weight:700;line-height:1.02;letter-spacing:-.03em;margin:0}
.desk .who{font-size:21px;font-weight:500;color:var(--dim);margin:8px 0 0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.ideas li{background:rgba(0,0,0,.28);border-radius:26px;padding:24px 28px;border-top:6px solid var(--c)}
.lbl{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.ideas .idea{font-size:30px;font-weight:700;line-height:1.25;margin:0}
.ideas .note{font-size:22px;font-weight:400;line-height:1.45;margin:8px 0 0;color:var(--soft)}
.wo{margin-top:24px;border:2px solid var(--amber);border-radius:26px;padding:22px 28px}
.wo .lbl{color:var(--amber)}
.wo p.t{font-size:25px;font-weight:600;line-height:1.4;margin:0}

/* end */
.end{display:flex;flex-direction:column;justify-content:center}
.end h2{font-size:112px;font-weight:800;line-height:.98;letter-spacing:-.04em;margin:0 0 30px}
.end p{font-size:32px;font-weight:500;line-height:1.45;margin:0 0 40px;color:var(--soft);max-width:24ch}
.end .go{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:700;color:#1d1c1a;background:var(--green);border-radius:999px;padding:18px 36px;text-decoration:none}
.end .url{font-size:19px;color:var(--dim);margin-top:18px;word-break:break-all}

/* viewer (artifact) */
body:not([data-mode="print"]){min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
body:not([data-mode="print"]) #deck{position:relative;width:min(540px,100%);aspect-ratio:1080/1350}
body:not([data-mode="print"]) .slide{position:absolute;top:0;left:0;transform-origin:top left;display:none}
body:not([data-mode="print"]) .slide.on{display:block}
body:not([data-mode="print"]) .slide.on.cover,body:not([data-mode="print"]) .slide.on.end{display:flex}
.nav{display:flex;align-items:center;gap:14px;font-weight:600;color:var(--soft)}
.nav button{font:inherit;font-weight:700;color:#1d1c1a;background:var(--green);border:none;border-radius:999px;padding:10px 22px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
body[data-mode="print"] .nav{display:none}
body[data-mode="print"] .slide{page-break-after:always;break-after:page}
@page{size:1080px 1350px;margin:0}
</style>

<div id="deck"></div>
<div class="nav"><button id="prev" type="button">Back</button><span id="pos"></span><button id="next" type="button">Next</button></div>

h":[{"when":"Now","title":"Brands copying the Roadster “what if” format","note":"AI “what if” clips are the format of the week. Expect brand versions, and some backlash to them."},{"when":"All week","title":"Halloween build-up to Saturday 31 Oct","note":"Costume reveals, the Ramalama strut and the Boo prank will crowd feeds from Thursday."},{"when":"TBC","title":"Lime Bike Jousting II","note":"The organisers have promised a sequel. Watch for a date and whether Lime joins in."},{"when":"Wed 28 Oct","title":"Instagram drops Reels series links","note":"Any Reels linked in a series lose that link. Check client series before then."}],"desks":[{"id":"disney","name":"Disney UK","short":"Disney UK","byline":"Pip · Disney UK desk","color":"#4a74c9","logo":"logos/disney.png","ideas":[{"from":"Costume of the year","idea":"A Ramalama-style witch reveal for Hexed.","note":"Strut reveal ending on the Hexed poster. In cinemas 27 November."},{"from":"Use as reference","idea":"Fans recreate a classic Disney scene side by side.","note":"Invite recreations of one iconic moment with the new reference tool."}],"watch":"Unofficial AI “what if” clips of famous characters are the format of the week. Agree now how to respond if Disney ones spread."},{"id":"family","name":"Disney Family UK","short":"Disney Family","byline":"Bo · Disney Family UK desk","color":"#a983cf","logo":"logos/disney.png","ideas":[{"from":"Costume of the year","idea":"Parent and child matching costume reveals.","note":"A family strut reveal in Disney costumes for Halloween week."},{"from":"The Boo prank","idea":"The Boo prank, family edition.","note":"A parent tries the boo on their kids. Reaction shot does the work."}],"watch":"This year's top adult costumes are horror looks (Nikki, Scream). Keep family content clear of that imagery."},{"id":"muti","name":"Mutti UK","short":"Mutti","byline":"Kiki · Mutti UK desk","color":"#d8302b","logo":"logos/mutti.png","ideas":[{"from":"TikTok Shop carousels","idea":"A five-image passata recipe carousel.","note":"One photo per step. If Mutti sells on TikTok Shop UK, link the product (check first)."},{"from":"Halloween","idea":"A blood-red Halloween pasta for party night.","note":"A spooky-styled passata dish as a quick recipe Reel."}],"watch":"Halloween is Saturday 31 Oct. Spooky recipes need to be live by Thursday 29th to catch people planning."},{"id":"dfs","name":"DFS","short":"DFS","byline":"Dot · DFS desk","color":"#2f9c8f","logo":"logos/dfs.png","ideas":[{"from":"TikTok Shop carousels","idea":"One sofa, styled for day and for night.","note":"A shoppable carousel borrowing the “day vs night” decor format."},{"from":"Use as reference","idea":"Recreate a viral room makeover with a DFS sofa.","note":"A side-by-side Reel made with the new reference tool."}],"watch":"Shoppable photo carousels are new for UK sellers. Test them now, before Black Friday (27 Nov) gets crowded."}]}</script>
<script>
(function(){
const E = JSON.parse(document.getElementById('edition').textContent || '{}');
const deck = document.getElementById('deck');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *words* in headlines are set in Jungle green
const hi = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = s => String(s == null ? '' : s).replace(/\*/g, '');
const short = u => String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/$/, '');
const link = u => '<a href="' + esc(u) + '">' + esc(short(u).length > 60 ? short(u).slice(0, 58) + '…' : short(u)) + '</a>';
const MOM = {Rising:'up', Peaking:'peak', Fading:'down'};
const edition = E.edition || 'The daily';
const bar = (l, r) => '<div class="bar"><span>' + esc(l) + '</span><span>' + esc(r) + '</span></div>';
const mark = '<div class="mark"><img src="logos/jungle-wordmark-white.png" alt="jungle"></div>';
const SECTIONS = [['saw', 'Things we saw'], ['platform', 'Platform highlights']];
const S = E.sections || {};
const slides = [];

slides.push('<section class="slide cover">' + bar(edition, 'The Jungle Newsroom · ' + (E.dateLabel || '')) +
  '<p class="kick">The Jungle Newsroom</p><h1>' + hi(E.coverTitle || edition) + '</h1>' +
  '<p class="sub">' + hi(E.coverSub || 'what’s moving on social') + '</p>' +
  SECTIONS.filter(([k]) => (S[k] || []).length).map(([k, name]) => '<h3>' + name + '</h3><ol>' + S[k].map(s => '<li>' + esc(plain(s.short || s.headline)) + '</li>').join('') + '</ol>').join('') +
  mark + '</section>');

SECTIONS.forEach(([k, name]) => {
  const list = S[k] || [];
  list.forEach((s, i) => {
    slides.push('<section class="slide story">' + bar(name, String(i + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0') + ' · ' + (E.dateLabel || '')) +
      (s.image ? '<div class="pic"><img src="' + esc(s.image) + '" alt=""></div>' : '') +
      '<div class="chips"><span class="chip ' + (MOM[s.momentum] || '') + '">' + esc(s.momentum) + '</span><span class="chip">' + esc(s.region) + '</span><span class="chip">' + esc(s.platform) + '</span></div>' +
      '<h2>' + hi(s.headline) + '</h2><p class="what">' + esc(s.what) + '</p>' +
      '<div class="why"><p><b>Why it matters: </b>' + esc(s.why) + '</p></div>' +
      '<div class="foot">' + esc(s.source) + (s.credit ? ' · Image: ' + esc(s.credit) : '') + (s.url ? '<br>' + link(s.url) : '') + '</div>' + mark + '</section>');
  });
});

if ((E.watch || []).length) {
  slides.push('<section class="slide watch">' + bar('This week', E.dateLabel || '') +
    '<h2>Things to watch <em>this week</em></h2><ul class="wl">' +
    E.watch.map(w => '<li><span class="when">' + esc(w.when) + '</span><div><p class="t">' + esc(w.title) + '</p>' + (w.note ? '<p class="n">' + esc(w.note) + '</p>' : '') + '</div></li>').join('') +
    '</ul>' + mark + '</section>');
}

(E.desks || []).forEach(d => {
  if (!(d.ideas || []).length && !d.watch) return;
  slides.push('<section class="slide desk" style="--c:' + d.color + '">' + bar('For our clients', d.short) +
    '<div class="head"><div class="tile">' + (d.logo ? '<img src="' + esc(d.logo) + '" alt="' + esc(d.name) + '">' : '') + '</div>' +
    '<div><h2>' + hi(d.title || ('For *' + d.name + '*')) + '</h2><p class="who">' + esc(d.byline) + '</p></div></div>' +
    '<ul class="ideas">' + (d.ideas || []).map(it => '<li><p class="lbl">Idea · ' + esc(it.from) + '</p><p class="idea">' + esc(it.idea) + '</p>' + (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') + '</li>').join('') + '</ul>' +
    (d.watch ? '<div class="wo"><p class="lbl">Watch out</p><p class="t">' + esc(d.watch) + '</p></div>' : '') +
    mark + '</section>');
});

slides.push('<section class="slide end">' + bar('The Jungle Newsroom', E.dateLabel || '') +
  '<h2>Did we <em>miss</em> something?</h2>' +
  '<p>Let us know what we missed and what you want more of tomorrow.</p>' +
  (E.floorUrl ? '<a class="go" href="' + esc(E.floorUrl) + '">See the newsroom island →</a><p class="url">' + esc(short(E.floorUrl)) + '</p>' : '') +
  mark + '</section>');

deck.innerHTML = slides.join('');
const els = [...deck.querySelectorAll('.slide')];

// viewer: one slide at a time, scaled to fit
let cur = 0;
const pos = document.getElementById('pos'), prev = document.getElementById('prev'), next = document.getElementById('next');
function fit(){
  if (document.body.dataset.mode === 'print') return;
  const s = deck.clientWidth / 1080;
  els.forEach(el => { el.style.transform = 'scale(' + s + ')'; });
}
function show(i){
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, k) => el.classList.toggle('on', k === cur));
  pos.textContent = (cur + 1) + ' / ' + els.length;
  prev.disabled = cur === 0; next.disabled = cur === els.length - 1;
}
prev.addEventListener('click', () => show(cur - 1));
next.addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
let sx = null;
deck.addEventListener('pointerdown', e => { sx = e.clientX; });
deck.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 40) show(cur + (e.clientX < sx ? 1 : -1)); sx = null; });
window.addEventListener('resize', fit);
fit(); show(0);
})();
</script>

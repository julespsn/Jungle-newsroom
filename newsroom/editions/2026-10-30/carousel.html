<title>Jungle Newsroom Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 1080x1350 slides in Jungle's Instagram carousel style (dark concrete texture, hairline top bar,
   Poppins, Jungle green for the key words, the jungle wordmark bottom right). Story slides lead with a picture.
   Viewer mode (default) shows one slide at a time; print mode (set by render.js) stacks them for PNG/PDF export. */
:root{
  --bg:#3b3936; --white:#ffffff; --soft:#dedad3; --dim:#aaa59d; --green:#7ef25c; --amber:#ffc94a; --grey:#8d8880;
  --sans:'Poppins','Helvetica Neue',Arial,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#161514;color:var(--white);font-family:var(--sans)}
a{color:inherit}

.slide{position:relative;width:1080px;height:1350px;box-sizing:border-box;padding:136px 76px 150px;overflow:hidden;background:var(--bg);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(0,0,0,.35),transparent 60%)}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.slide > *{position:relative;z-index:1}
em{font-style:normal;color:var(--green)}

.bar{position:absolute;top:52px;left:76px;right:76px;display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.55);
  font-size:21px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.bar span:last-child{text-transform:none;font-weight:500}
.mark{position:absolute;right:70px;bottom:56px;height:52px}
.mark img{height:100%;display:block}
.foot{position:absolute;left:76px;bottom:58px;max-width:700px;font-size:19px;line-height:1.45;color:var(--dim)}
.foot a{color:var(--green);text-decoration:none;font-weight:600;word-break:break-all}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center}
.cover .kick{font-size:28px;font-weight:600;color:var(--soft);margin:0 0 4px}
.cover h1{font-size:132px;font-weight:800;line-height:.95;letter-spacing:-.04em;margin:0;color:var(--green)}
.cover .sub{font-size:62px;font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:8px 0 44px}
.cover h3{font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:22px 0 10px}
.cover ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cover li{font-size:27px;font-weight:500;line-height:1.25;color:var(--soft);padding-left:26px;position:relative}
.cover li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--green)}

/* story */
.pic{height:500px;border-radius:30px;overflow:hidden;background:#222;margin:0 0 30px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.chip{font-size:19px;font-weight:600;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 16px;color:var(--soft)}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.peak{border-color:var(--amber);color:var(--amber)}
.chip.spoil{border-color:#ff7a66;color:#ff7a66}
.chip.down{border-color:var(--grey);color:var(--grey)}
.story h2{font-size:56px;font-weight:700;line-height:1.08;letter-spacing:-.03em;margin:0 0 18px;text-wrap:balance}
.story .what{font-size:25px;font-weight:400;line-height:1.5;margin:0 0 20px;color:var(--soft)}
.why{border-left:5px solid var(--green);padding:2px 0 2px 22px}
.why p{margin:0;font-size:24px;font-weight:500;line-height:1.45}
.why b{color:var(--green);font-weight:700}

/* watch list */
.watch h2{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:30px 0 44px}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.wl li{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(0,0,0,.25);border-radius:26px;padding:24px 28px}
.wl .when{font-size:20px;font-weight:700;color:#1d1c1a;background:var(--green);border-radius:999px;text-align:center;padding:6px 10px;align-self:start}
.wl .t{font-size:29px;font-weight:700;line-height:1.2;margin:0}
.wl .n{font-size:22px;font-weight:400;line-height:1.45;margin:6px 0 0;color:var(--soft)}

/* desk */
.desk .head{display:flex;align-items:center;gap:28px;margin:12px 0 34px}
.desk .tile{width:150px;height:150px;border-radius:28px;background:var(--white);display:grid;place-items:center;flex:none;box-shadow:inset 0 -10px 0 var(--c)}
.desk .tile img{max-width:112px;max-height:74px;margin-bottom:8px}
.desk h2{font-size:58px;font-weight:700;line-height:1.02;letter-spacing:-.03em;margin:0}
.desk .who{font-size:21px;font-weight:500;color:var(--dim);margin:8px 0 0}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.ideas li{background:rgba(0,0,0,.28);border-radius:26px;padding:24px 28px;border-top:6px solid var(--c)}
.lbl{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.ideas .idea{font-size:30px;font-weight:700;line-height:1.25;margin:0}
.ideas .note{font-size:22px;font-weight:400;line-height:1.45;margin:8px 0 0;color:var(--soft)}
.wo{margin-top:24px;border:2px solid var(--amber);border-radius:26px;padding:22px 28px}
.wo .lbl{color:var(--amber)}
.wo p.t{font-size:25px;font-weight:600;line-height:1.4;margin:0}

/* end */
.end{display:flex;flex-direction:column;justify-content:center}
.end h2{font-size:112px;font-weight:800;line-height:.98;letter-spacing:-.04em;margin:0 0 30px}
.end p{font-size:32px;font-weight:500;line-height:1.45;margin:0 0 40px;color:var(--soft);max-width:30ch}
.end .go{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:700;color:#1d1c1a;background:var(--green);border-radius:999px;padding:18px 36px;text-decoration:none}
.end .url{font-size:19px;color:var(--dim);margin-top:18px;word-break:break-all}

/* viewer (artifact) */
body:not([data-mode="print"]){min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
body:not([data-mode="print"]) #deck{position:relative;width:min(540px,100%);aspect-ratio:1080/1350}
body:not([data-mode="print"]) .slide{position:absolute;top:0;left:0;transform-origin:top left;display:none}
body:not([data-mode="print"]) .slide.on{display:block}
body:not([data-mode="print"]) .slide.on.cover,body:not([data-mode="print"]) .slide.on.end{display:flex}
.nav{display:flex;align-items:center;gap:14px;font-weight:600;color:var(--soft)}
.nav button{font:inherit;font-weight:700;color:#1d1c1a;background:var(--green);border:none;border-radius:999px;padding:10px 22px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
body[data-mode="print"] .nav{display:none}
body[data-mode="print"] .slide{page-break-after:always;break-after:page}
@page{size:1080px 1350px;margin:0}
</style>

<div id="deck"></div>
<div class="nav"><button id="prev" type="button">Back</button><span id="pos"></span><button id="next" type="button">Next</button></div>

<script id="edition" type="application/json">{"edition":"Best of the week","coverTitle":"Best of the week","coverSub":"what *kept moving* on social","dateLabel":"Friday 30 October","floorUrl":"https://newsroom-production-7727.up.railway.app/","sections":{"saw":[{"short":"Celebrity Traitors fans spend a week hunting clues before the finale","headline":"Celebrity Traitors fans spent the week *hunting clues*","what":"Fans treated tiny details as evidence, such as King Kenny's pen position, which some read as a clue to who was next. The finale is tonight at 8pm on BBC One, with Uncloaked at 9.20pm.","why":"Fans do the guessing, so every episode restarts the theories. Tonight is the peak.","momentum":"Peaking","region":"UK","platform":"X & Reddit","source":"LADbible, 23 Oct; BBC schedule","credit":"BBC via LADbible","url":"https://www.ladbible.com/entertainment/tv/the-celebrity-traitors-murder-681442-20261023","image":"images/traitors.jpg"},{"short":"Bradley Walsh's mystery quiz is explained, and it airs on Sunday","headline":"Bradley Walsh's *mystery quiz* is explained","what":"A live-TV-only trailer had people guessing. Channel 4's synopsis, out on Wednesday, says contestants bring their own bank cards and bet cash on general-knowledge questions, winning “Bet Balls” they can cash out or fire into the “Million Pound Shot Machine” for £1m. It's a one-off on Sunday at 9pm.","why":"The mystery trailer did its job: people guessed, then the format landed days before the show.","momentum":"Rising","region":"UK","platform":"X & Bluesky","source":"GB News, 28 Oct","credit":"Channel 4 via GB News","url":"https://www.gbnews.com/celebrity/bradley-walsh-channel-4-quiz-show-million-pound-shot-hoax","image":"images/walsh.jpg"},{"short":"Asda's £30-off deal becomes a half-price video game hack","headline":"Asda's £30-off deal becomes a *half-price game hack*","what":"Asda offered £30 off a £60+ shop to first-time online customers who sign up to marketing emails. It worked on electronics, including Call of Duty: Modern Warfare 4 at half price. By Tuesday 27 Oct Asda had paused it, citing “a significant number of orders that do not qualify”.","why":"Promo terms get tested in public within days, and receipts and how-to videos become the content.","momentum":"Fading","region":"UK","platform":"X & TikTok","source":"LADbible, 27 Oct","credit":"LADbible","url":"https://www.ladbible.com/news/uk-news/asda-30-pound-off-loophole-call-of-duty-990841-20261027","image":"images/asda.jpg"},{"short":"Harry Kane wins the Ballon d'Or in London, after a website leak","headline":"Harry Kane wins the *Ballon d'Or* in London","what":"Harry Kane won on Monday, the first Englishman since Michael Owen in 2001. Hours earlier the awards website wrongly published articles naming Kane, Kylian Mbappé and Lamine Yamal each as winner. Organisers said the profiles were “inadvertently published”.","why":"A British winner and an accidental leak gave people two reasons to post.","momentum":"Fading","region":"UK","platform":"X","source":"LADbible, 26 Oct; ESPN, 26 Oct","credit":"Getty via LADbible","url":"https://www.ladbible.com/news/sport/harry-kane-wins-ballon-d-or-becoming-first-englishman-25-years-440675-20261026","image":"images/kane.jpg"},{"short":"Just Eat's AI menu photos get ridiculed, then paused","headline":"Just Eat's *AI menu photos* get ridiculed, then paused","what":"Just Eat's AI-made dish photos went viral: bacon-and-egg soda bread became a glass of cola with an egg and bacon in it, and garlic bread became a plane. Just Eat said “We're sorry for any inaccurate images that have been posted” and paused the rollout.","why":"The gap between the picture and the real dish became the joke. Real photos beat AI that gets it wrong.","momentum":"Fading","region":"UK","platform":"Reddit, Instagram & X","source":"Dexerto, 23 Oct (citing the BBC and The Journal)","credit":"Dexerto / Just Eat","url":"https://www.dexerto.com/food/just-eat-apologizes-after-ai-turns-food-into-literal-potato-jackets-tiger-cubs-bacon-soda-3421330/","image":"images/justeat.jpg"},{"short":"The niche Halloween costume meme is back, a day before Halloween","headline":"The *niche Halloween costume* meme is back","what":"The annual format is back on X: people caption deep-cut costume ideas, such as Dakota Johnson and limes or Princess Diana's revenge dress. The Tab, citing Know Your Meme, traces it to 2022–2023, and it went massively viral in 2024. Halloween is tomorrow.","why":"The more obscure the costume, the better the post. Brands can play with deep cuts from their own world.","momentum":"Peaking","region":"Global","platform":"X","source":"The Tab, 28 Oct","credit":"The Tab","url":"https://thetab.com/2026/10/28/the-origins-of-the-i-hate-gay-halloween-meme-as-queer-people-dress-up-in-stupidly-niche-costumes","image":"images/niche.jpg"}],"platform":[{"short":"Meta pushes its new business terms back to 20 Nov","headline":"Meta *pushes back* its business terms to 20 Nov","what":"Meta moved its new commercial terms from 30 Oct to 20 Nov “to allow more time for us to explain”, after complaints from publishers and advertisers to EU and UK antitrust authorities. Critics say the terms give Meta broad rights to use content for AI. Meta rejects that.","why":"Anything planned around 30 Oct can wait. The dispute is about AI training rights over business content.","momentum":"Peaking","region":"UK","platform":"Facebook & Instagram","source":"Reuters, 23 Oct","credit":"Meta via Reuters","url":"https://wsau.com/2026/10/23/meta-to-delay-new-commercial-terms-criticised-by-publishers-advertisers/","image":"images/metaterms.jpg"},{"short":"Instagram tests 90-minute videos with select US creators","headline":"Instagram tests *90-minute videos* with US creators","what":"Instagram has begun testing “Features”: uploads of up to 90 minutes, such as podcasts and vlogs, with select US creators. Creators can link Reels clips to the full video, and it isn't exclusive to Instagram. No UK date has been given.","why":"Instagram is going after long-form video. Don't plan around it in the UK yet.","momentum":"Rising","region":"Global","platform":"Instagram","source":"Social Media Today, 26 Oct","credit":"Instagram via Social Media Today","url":"https://www.socialmediatoday.com/news/instagram-rolls-out-limited-features-test-in-the-us/872825/","image":"images/features.jpg"},{"short":"Discord will put public server messages into Google","headline":"Discord will put *public server messages* into Google","what":"From 16 Nov, Discord will create public web pages for big “Discoverable Servers”. From mid-December, messages in eligible public channels may appear there and in search. In the UK a user setting is off by default, so messages show only if people opt in.","why":"Public community chat becomes searchable. Brands with open Discords should check what's on show.","momentum":"Rising","region":"Global","platform":"Discord","source":"Dexerto, 27 Oct (citing Discord)","credit":"Discord via Dexerto","url":"https://www.dexerto.com/entertainment/discord-will-soon-let-anyone-find-public-server-messages-through-google-3422244/","image":"images/discord.jpg"}]},"watch":[{"when":"Tonight","title":"Celebrity Traitors finale","note":"8pm on BBC One, then Uncloaked at 9.20pm, per the BBC schedule. Keep captions spoiler-free."},{"when":"Sat 31 Oct","title":"Halloween, and Strictly's Halloween special","note":"Strictly's special is at 6:30pm on BBC One. Halloween content peaks today."},{"when":"Sun 1 Nov","title":"Bradley Walsh's The Million Pound Shot","note":"9pm on Channel 4, a one-off."},{"when":"Tue 3 Nov","title":"U2's secret BBC gig","note":"Recorded at a central London venue revealed only to ticket holders. On BBC Two later in November and Radio 2 on Mon 30 Nov."},{"when":"Thu 5 Nov","title":"Bonfire Night","note":"Fireworks and bonfire content peaks. Keep safety in mind in anything with children."}],"desks":[{"id":"disney","name":"Disney UK","short":"Disney UK","byline":"Pip · Disney UK desk","color":"#4a74c9","logo":"logos/disney.png","ideas":[{"from":"Niche costumes","idea":"Caption your Halloween costume with a film's least-quoted line.","note":"Halloween is Sat 31 Oct. Titles only, no cast names."},{"from":"Hexed","idea":"Four weeks to go: start a weekly Hexed countdown on Friday.","note":"Use the 27 Nov cinema date only. No plot claims."}],"watch":"The Glee reboot is announced, but the cast and date aren't. Keep posts to “announced” only."},{"id":"family","name":"Disney Family UK","short":"Disney Family","byline":"Bo · Disney Family UK desk","color":"#a983cf","logo":"logos/disney.png","ideas":[{"from":"Clue-hunt fandom","idea":"A hidden Halloween clue in each post for kids to find in the comments.","note":"No prizes or personal details in the comments."},{"from":"Bonfire Night","idea":"A Bonfire Night calm kit: ear defenders, a torch and a bedtime film list.","note":"Thu 5 Nov. Safety tips from official sources only."}],"watch":"No school names, uniform close-ups or children's faces without parental sign-off."},{"id":"store","name":"Disney Store UK","short":"Disney Store","byline":"Lulu · Disney Store UK desk","color":"#d4567f","logo":"logos/disney-store.png","ideas":[{"from":"Halloween","idea":"Last-minute costume: one plush, one hat, one-line caption.","note":"Tag only lines that are in stock. Confirm before posting."},{"from":"Bonfire Night","idea":"Bonfire Night in: three cosy plush picks for a film night.","note":"Check stock first. No sale or deadline claims."}],"watch":"Don't imply costumes or plush are safe or age-rated unless the label says so."},{"id":"muti","name":"Mutti UK","short":"Mutti","byline":"Kiki · Mutti UK desk","color":"#d8302b","logo":"logos/mutti.png","ideas":[{"from":"AI menu photos","idea":"No AI tomatoes: a real jar, a real pan, a real Tuesday.","note":"Real photos beat AI that gets it wrong. Don't name anyone else."},{"from":"Halloween","idea":"A slow passata pour, filmed once, no edits, for a spooky reveal.","note":"Food, not gore. Keep it appetising."}],"watch":"Show the real jar and pan. No health claims and no colour promises."},{"id":"on","name":"Optimum Nutrition UK","short":"Optimum Nutrition","byline":"Rex · Optimum Nutrition UK desk","color":"#c9962c","logo":"logos/on.png","ideas":[{"from":"Halloween","idea":"A gym-culture costume: shaker, tank top and a 6am alarm.","note":"Keep it light. No body-shape jokes."},{"from":"Promo terms gamed","idea":"A bundle deal explained in one plain sentence, with terms pinned.","note":"Offer terms get gamed in public. No health or results claims."}],"watch":"Teens may be in gyms. No supplement offers aimed at under-18s."},{"id":"dfs","name":"DFS","short":"DFS","byline":"Dot · DFS desk","color":"#2f9c8f","logo":"logos/dfs.png","ideas":[{"from":"Promo terms gamed","idea":"The sofa offer in one plain sentence, with the terms pinned below.","note":"Offer terms get gamed in public, so state them plainly."},{"from":"AI menu photos","idea":"Real living rooms in real light: no AI-rendered sofa sets this week.","note":"Real photos beat AI. Label any render as a render."}],"watch":"Don't claim a fabric is “stain-proof” or “pet-proof” unless it's tested and certified."}]}</script>
<script>
(function(){
const E = JSON.parse(document.getElementById('edition').textContent || '{}');
const deck = document.getElementById('deck');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *words* in headlines are set in Jungle green
const hi = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = s => String(s == null ? '' : s).replace(/\*/g, '');
const short = u => String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/$/, '');
const link = u => '<a href="' + esc(u) + '">' + esc(short(u).length > 60 ? short(u).slice(0, 58) + '…' : short(u)) + '</a>';
const MOM = {Rising:'up', Peaking:'peak', Fading:'down'};
const edition = E.edition || 'The daily';
const bar = (l, r) => '<div class="bar"><span>' + esc(l) + '</span><span>' + esc(r) + '</span></div>';
const mark = '<div class="mark"><img src="logos/jungle-wordmark-white.png" alt="jungle"></div>';
const SECTIONS = [['saw', 'Things we saw'], ['platform', 'Platform highlights']];
const S = E.sections || {};
const slides = [];

slides.push('<section class="slide cover">' + bar(edition, 'The Jungle Newsroom · ' + (E.dateLabel || '')) +
  '<p class="kick">The Jungle Newsroom</p><h1>' + hi(E.coverTitle || edition) + '</h1>' +
  '<p class="sub">' + hi(E.coverSub || 'what’s moving on social') + '</p>' +
  SECTIONS.filter(([k]) => (S[k] || []).length).map(([k, name]) => '<h3>' + name + '</h3><ol>' + S[k].map(s => '<li>' + esc(plain(s.short || s.headline)) + '</li>').join('') + '</ol>').join('') +
  mark + '</section>');

SECTIONS.forEach(([k, name]) => {
  const list = S[k] || [];
  list.forEach((s, i) => {
    slides.push('<section class="slide story">' + bar(name, String(i + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0') + ' · ' + (E.dateLabel || '')) +
      (s.image ? '<div class="pic"><img src="' + esc(s.image) + '" alt=""></div>' : '') +
      '<div class="chips">' + (s.spoiler ? '<span class="chip spoil">Spoilers</span>' : '') + '<span class="chip ' + (MOM[s.momentum] || '') + '">' + esc(s.momentum) + '</span><span class="chip">' + esc(s.region) + '</span><span class="chip">' + esc(s.platform) + '</span></div>' +
      '<h2>' + hi(s.headline) + '</h2><p class="what">' + esc(s.what) + '</p>' +
      '<div class="why"><p><b>Why it matters: </b>' + esc(s.why) + '</p></div>' +
      '<div class="foot">' + esc(s.source) + (s.credit ? ' · Image: ' + esc(s.credit) : '') + (s.url ? '<br>' + link(s.url) : '') + '</div>' + mark + '</section>');
  });
});

if ((E.watch || []).length) {
  slides.push('<section class="slide watch">' + bar('This week', E.dateLabel || '') +
    '<h2>Things to watch <em>this week</em></h2><ul class="wl">' +
    E.watch.map(w => '<li><span class="when">' + esc(w.when) + '</span><div><p class="t">' + esc(w.title) + '</p>' + (w.note ? '<p class="n">' + esc(w.note) + '</p>' : '') + '</div></li>').join('') +
    '</ul>' + mark + '</section>');
}

(E.desks || []).forEach(d => {
  if (!(d.ideas || []).length && !d.watch) return;
  slides.push('<section class="slide desk" style="--c:' + d.color + '">' + bar('For our clients', d.short) +
    '<div class="head"><div class="tile">' + (d.logo ? '<img src="' + esc(d.logo) + '" alt="' + esc(d.name) + '">' : '') + '</div>' +
    '<div><h2>' + hi(d.title || ('For *' + d.name + '*')) + '</h2><p class="who">' + esc(d.byline) + '</p></div></div>' +
    '<ul class="ideas">' + (d.ideas || []).map(it => '<li><p class="lbl">Idea · ' + esc(it.from) + '</p><p class="idea">' + esc(it.idea) + '</p>' + (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') + '</li>').join('') + '</ul>' +
    (d.watch ? '<div class="wo"><p class="lbl">Watch out</p><p class="t">' + esc(d.watch) + '</p></div>' : '') +
    mark + '</section>');
});

slides.push('<section class="slide end">' + bar('The Jungle Newsroom', E.dateLabel || '') +
  '<h2>Did we <em>miss</em> something?</h2>' +
  '<p>Spotted something we missed? Or want more of something tomorrow? Reply under this post in #agency-hq.</p>' +
  (E.floorUrl ? '<a class="go" href="' + esc(E.floorUrl) + '">See the newsroom island →</a><p class="url">' + esc(short(E.floorUrl)) + '</p>' : '') +
  mark + '</section>');

deck.innerHTML = slides.join('');
const els = [...deck.querySelectorAll('.slide')];

// viewer: one slide at a time, scaled to fit
let cur = 0;
const pos = document.getElementById('pos'), prev = document.getElementById('prev'), next = document.getElementById('next');
function fit(){
  if (document.body.dataset.mode === 'print') return;
  const s = deck.clientWidth / 1080;
  els.forEach(el => { el.style.transform = 'scale(' + s + ')'; });
}
function show(i){
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, k) => el.classList.toggle('on', k === cur));
  pos.textContent = (cur + 1) + ' / ' + els.length;
  prev.disabled = cur === 0; next.disabled = cur === els.length - 1;
}
prev.addEventListener('click', () => show(cur - 1));
next.addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
let sx = null;
deck.addEventListener('pointerdown', e => { sx = e.clientX; });
deck.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 40) show(cur + (e.clientX < sx ? 1 : -1)); sx = null; });
window.addEventListener('resize', fit);
fit(); show(0);
})();
</script>
